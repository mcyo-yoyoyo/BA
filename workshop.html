<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>友为 · 从战略到路标</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', 'sans-serif'],
                    },
                    colors: {
                        canvas: { DEFAULT: '#f4f1ea', subtle: '#f7f5f0' },
                        ink: { DEFAULT: '#161513', secondary: '#4f4b45', tertiary: '#6e695f' },
                        accent: { DEFAULT: '#3d534b', hover: '#2d3f39', muted: 'rgba(61,83,75,0.10)' },
                        line: 'rgba(22,21,19,0.12)',
                    },
                    boxShadow: {
                        card: '0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.04)',
                        nav: '0 1px 2px rgba(0,0,0,0.04)',
                    },
                },
            },
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/workshop-unify.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            /* 顶栏高度由脚本写入，供侧栏按钮避让 sticky header */
            --header-offset: 4.75rem;
            /* 左侧工作流展开宽度（较原 280px 缩减 40% → 168px） */
            --sidebar-expanded: 168px;
            /* 主内容区最大宽度：原 1400px 加宽约 50%，并与视口留白取较小值 */
            --app-max-width: min(2100px, calc(100vw - 2rem));
        }
        /* 全局缩放过大易导致 dvh + overflow:hidden 底部裁切；默认 1 保证一屏内控件完整可见 */
        body { zoom: 1; }
        body.html-exporting { zoom: 1 !important; }
        body { -webkit-font-smoothing: antialiased; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .html-export-print-mode {
            position: absolute; top: 0; left: 0; right: 0; z-index: 9999;
            background: white; padding: 40px; width: 210mm; margin: auto;
        }
        .html-export-print-mode .step-wrapper { display: block !important; flex: none !important; margin-bottom: 40px; page-break-after: always; }
        .html-export-print-mode .print-hidden { display: none !important; }
        .step-wrapper { display: none; animation: fadeIn 0.28s ease-out; }
        .step-wrapper.active { display: flex; flex-direction: column; min-height: 0; flex: 1; }
        /* 数字化资产配置：按内容撑开高度，由 #workspace-scroll 整体滚动，避免规则列表被压在固定视口内 */
        #step-8.step-wrapper.active { flex: 0 0 auto; min-height: 0; }
        #workspace-scroll {
            flex: 1 1 0;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .method-panel { background: #fafafa; border: 1px solid rgba(0,0,0,0.06); border-radius: 12px; }
        .heat-red { background: linear-gradient(180deg, #fff5f5 0%, #fee 100%); border-color: rgba(220,38,38,0.25); }
        .heat-yellow { background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 100%); border-color: rgba(180,83,9,0.2); }
        .heat-green { background: linear-gradient(180deg, #f0fdf4 0%, #dcfce7 100%); border-color: rgba(22,163,74,0.22); }
        .heat-watch { background: #f3f1ec; border-color: rgba(44,42,38,0.10); }
        .ui-table-wrap { border: 1px solid rgba(0,0,0,0.06); border-radius: 12px; overflow: hidden; background: #fff; }
        .ui-table-wrap table thead { background: #fafafa; }
        .ui-table-wrap th { font-weight: 600; color: #6e6e73; letter-spacing: 0.02em; }
        .progress-dot { width: 6px; height: 6px; border-radius: 9999px; background: rgba(22,21,19,.16); transition: background .2s, transform .2s; }
        .progress-dot.done { background: #8a9a94; }
        .progress-dot.current { background: #3d534b; transform: scale(1.25); }
        .step-progress-rail { display: flex; align-items: flex-end; gap: 2px 10px; }
        .step-progress-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            min-width: 2.25rem; padding: 2px 4px 0; border: 0; background: transparent;
            cursor: pointer; font-family: inherit; color: #6e695f;
        }
        .step-progress-item:hover .step-progress-label { color: #161513; }
        .step-progress-label {
            font-size: 11px; font-weight: 650; letter-spacing: .06em; line-height: 1;
            white-space: nowrap;
        }
        .step-progress-item.is-done .step-progress-label { color: #5c5852; }
        .step-progress-item.is-current .step-progress-label { color: #3d534b; font-weight: 800; }
        /* 变革路标甘特：竖向网格线与粘性标签列 */
        .roadmap-gantt-scroll { --rg-months: 24; }
        .roadmap-gantt-track {
            position: relative;
            min-height: 28px;
            background-image: repeating-linear-gradient(
                90deg,
                transparent 0,
                transparent calc(100% / var(--rg-months, 24) - 1px),
                rgba(0, 0, 0, 0.06) calc(100% / var(--rg-months, 24) - 1px),
                rgba(0, 0, 0, 0.06) calc(100% / var(--rg-months, 24))
            );
        }
        .roadmap-gantt-bar {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            min-width: 8px;
            height: 18px;
            border-radius: 6px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        }
        .roadmap-gantt-bar.sm { height: 14px; border-radius: 5px; }
        /* 子路标起止横条：灰色虚线轮廓（非轨道竖格线） */
        .roadmap-gantt-bar-stream {
            background-color: rgba(82, 82, 91, 0.06) !important;
            border: 1px dashed #5c5c63;
            box-shadow: none !important;
        }
        @media print {
            .roadmap-gantt-scroll { overflow: visible !important; }
        }
        /* HTML 快照导出时解除一屏高度限制，避免克隆出的版面被裁切 */
        body.html-exporting,
        body.html-exporting #workspace,
        body.html-exporting #workspace-row,
        body.html-exporting #workspace-scroll {
            overflow: visible !important;
            height: auto !important;
            max-height: none !important;
        }
        /* 禁止改为 display:block：会破坏 body→main 的 flex 分配，导致 grid 行高 1fr 塌成 0，导出快照高度为 0 */
        body.html-exporting.app-shell {
            display: flex !important;
            flex-direction: column !important;
            height: auto !important;
            min-height: 100vh !important;
            max-height: none !important;
            overflow: visible !important;
        }
        body.html-exporting.app-shell > header {
            flex-shrink: 0 !important;
        }
        body.html-exporting .ai-assistant-root,
        body.html-exporting #ai-assistant-drawer,
        body.html-exporting #ai-assistant-rail { display: none !important; }
        .ai-assistant-float-btn {
            position: fixed;
            right: max(16px, env(safe-area-inset-right));
            bottom: max(92px, calc(env(safe-area-inset-bottom) + 76px));
            z-index: 210;
            width: 52px;
            height: 52px;
            border-radius: 9999px;
            border: 1px solid rgba(61, 83, 75, 0.35);
            background: #3d534b;
            color: #f7f6f2;
            box-shadow: 0 4px 20px rgba(61, 83, 75, 0.22);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .ai-assistant-float-btn:hover { transform: scale(1.05); box-shadow: 0 6px 24px rgba(61, 83, 75, 0.28); }
        .ai-assistant-drawer {
            position: fixed;
            right: max(12px, env(safe-area-inset-right));
            bottom: max(84px, env(safe-area-inset-bottom));
            z-index: 209;
            width: min(432px, calc(100vw - 20px));
            max-height: min(91vh, 702px);
            display: flex;
            flex-direction: column;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: #fff;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }
        .ai-assistant-drawer.hidden { display: none !important; }
        .ai-drawer-drag-handle {
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .ai-drawer-drag-handle.ai-drawer-dragging {
            cursor: grabbing;
        }
        #ai-output { font-size: 13px; line-height: 1.55; color: #1d1d1f; }

        body.html-exporting.app-shell > #workbench-body,
        body.html-exporting.app-shell > #workbench-body > #main-layout,
        body.html-exporting.app-shell > #main-layout {
            flex: 1 1 auto !important;
            min-height: calc(100vh - 80px) !important;
            max-height: none !important;
            /* 侧栏隐藏后若仍为双列网格，工作区只占右列会变窄，导出快照里中文易挤压、重影似乱码 */
            grid-template-columns: minmax(0, 1fr) !important;
        }
        body.html-exporting #main-layout > aside,
        body.html-exporting #nav-rail,
        body.html-exporting #nav-drawer-backdrop {
            display: none !important;
        }
        body.html-exporting #workspace-scroll {
            display: flex !important;
            flex-direction: column !important;
            align-items: stretch !important;
            /* 由步骤内容撑开总高度，避免固定 min-height 导致截图高度计量误差、重叠或裁切 */
            min-height: auto !important;
        }
        /* 导出 HTML 快照时展开纵向滚动区，保证克隆 DOM 含完整 scrollHeight，避免表格/热力/举措显示不全 */
        body.html-exporting .overflow-y-auto {
            overflow-y: visible !important;
            max-height: none !important;
        }
        body.html-exporting .overflow-auto {
            overflow: visible !important;
            max-height: none !important;
        }
        /* 甘特等横向滚动区域展开，避免右侧轨被裁掉 */
        body.html-exporting .overflow-x-auto {
            overflow-x: visible !important;
        }
        body.html-exporting {
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
        }
        /* 桌面网格下 workspace 仍有 max-height:100%，导出时必须放开否则长步骤被压扁，快照版面错位、裁切 */
        body.html-exporting #main-layout > #workspace {
            max-height: none !important;
            min-height: 0 !important;
            align-self: stretch !important;
        }
        body.html-exporting .step-wrapper {
            animation: none !important;
            opacity: 1 !important;
            transform: none !important;
        }
        body.html-exporting .step-wrapper.active {
            flex: 0 0 auto !important;
            min-height: auto !important;
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            overflow: visible !important;
            box-sizing: border-box !important;
            -webkit-font-smoothing: antialiased !important;
        }
        body.html-exporting .ui-table-wrap,
        body.html-exporting .ui-table-wrap table {
            overflow: visible !important;
        }
        /* HTML 快照导出时解除 flex 收缩，避免画布类区块高度塌成一条 */
        body.html-exporting .bmc-nine {
            flex: none !important;
            min-height: 420px;
        }
        body.html-exporting .bmc-nine-main {
            min-height: 260px;
        }
        body.html-exporting .roadmap-gantt-scroll {
            min-height: 480px;
            max-height: none !important;
            overflow: visible !important;
        }
        body.youwei-briefing-capture #ai-assistant-root,
        body.youwei-briefing-capture #ai-assistant-drawer,
        body.youwei-briefing-capture #ai-assistant-rail,
        body.youwei-briefing-capture #footer-nav,
        body.youwei-briefing-capture #wendao-brief-strip,
        body.youwei-briefing-capture .print-hidden {
            display: none !important;
        }
        body.youwei-assets-open { overflow: hidden; }
        #assets-standalone-overlay {
            background: var(--canvas, #f4f1ea);
        }
        /* 桌面端：整体纵向 flex，主区占满顶栏以下剩余高度，避免 calc 与 zoom 导致与顶栏叠层 */
        @media (min-width: 1024px) {
            body.app-shell {
                display: flex;
                flex-direction: column;
                height: 100dvh;
                max-height: 100dvh;
                overflow: hidden;
            }
            body.app-shell > header {
                flex-shrink: 0;
            }
            body.app-shell > #workbench-body {
                flex: 1 1 0;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }
            body.app-shell > #workbench-body > #main-layout,
            body.app-shell > #main-layout {
                flex: 1 1 0;
                min-height: 0;
                max-height: none;
                height: auto;
                /* 单行两列时行高随视口约束；避免侧栏内容最小高度把整行撑出视口导致底部导出按钮被裁切 */
                grid-template-rows: minmax(0, 1fr);
            }
        }
        /* 主区：侧栏叠在工作区卡片之上，减轻右侧阴影盖住侧栏控件 */
        #main-layout {
            isolation: isolate;
        }
        #nav-drawer-backdrop {
            display: none;
        }
        #sidebar {
            position: relative;
            z-index: 3;
        }
        #workspace {
            position: relative;
            z-index: 2;
        }
        /* 主区网格：桌面侧栏宽可动画收缩；子项 min-height:0 否则中间区域无法内部滚动 */
        @media (min-width: 1024px) {
            #main-layout {
                grid-template-columns: minmax(0, 1fr);
                transition: grid-template-columns 0.22s ease;
            }
            #main-layout > aside,
            #main-layout > #workspace {
                min-height: 0;
                align-self: stretch;
                max-height: 100%;
            }
            #sidebar {
                overflow: hidden;
            }
            #sidebar-workflow-stack {
                min-height: 0;
            }
            #nav-list {
                flex: 1 1 0%;
                min-height: 0;
            }
            #footer-nav {
                padding-top: 0.375rem;
                padding-bottom: 0.375rem;
            }
            #footer-nav button {
                padding-top: 0.375rem;
                padding-bottom: 0.375rem;
            }
            #main-layout,
            #main-layout.sidebar-collapsed {
                grid-template-columns: minmax(0, 1fr);
            }
            #sidebar,
            #sidebar.sidebar-collapsed {
                position: fixed;
                top: calc(var(--header-offset) + 10px);
                left: 0;
                bottom: 16px;
                height: auto;
                max-height: calc(100dvh - var(--header-offset) - 26px);
                width: min(248px, 78vw);
                z-index: 86;
                padding: 10px 10px 12px;
                background: #f7f5f1;
                border-right: 1px solid rgba(44, 42, 38, 0.12);
                box-shadow: 16px 0 40px rgba(22, 21, 19, 0.12);
                transform: translateX(-105%);
                transition: transform 0.22s ease;
                overflow: hidden;
                pointer-events: none;
            }
            body.nav-drawer-open #sidebar {
                transform: none;
                pointer-events: auto;
            }
            #nav-drawer-backdrop {
                display: none;
                position: fixed;
                inset: var(--header-offset) 0 0 0;
                z-index: 85;
                background: rgba(22, 21, 19, 0.22);
                -webkit-backdrop-filter: blur(6px);
                backdrop-filter: blur(6px);
            }
            body.nav-drawer-open #nav-drawer-backdrop {
                display: block;
            }
        }
        /* 小屏：折叠工作流整块；顶栏 sticky 时工具条留在可视区顶部稍下，避免被遮挡 */
        .wendao-guide {
            position: fixed; inset: 0; z-index: 240;
            background: rgba(22,21,19,.58);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }
        .wendao-guide.hidden { display: none !important; }
        .wendao-guide-card {
            position: relative;
            width: min(420px, 100%);
            background: #f7f5f0; border: 1px solid rgba(22,21,19,.12);
            padding: 32px 28px 24px;
        }
        .wendao-guide-brand { display: flex; align-items: baseline; margin: 0 0 18px; color: #161513; }
        .wendao-guide-brand span { font-size: 16px; font-weight: 600; letter-spacing: .04em; }
        .wendao-guide-brand i { font-style: normal; margin-left: 10px; padding-left: 10px; border-left: 1px solid rgba(22,21,19,.12); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #4f4b45; }
        .wendao-guide-kicker { margin: 0 0 8px; font-size: 13px; font-weight: 650; color: #3d534b; letter-spacing: 0; text-transform: none; }
        .wendao-guide-card h2 { margin: 0; font-size: 26px; letter-spacing: -.03em; font-weight: 600; color: #161513; line-height: 1.2; }
        .wendao-guide-lead { margin: 10px 0 0; font-size: 15px; line-height: 1.6; color: #4f4b45; }
        .wendao-guide-path { margin: 12px 0 0; font-size: 12px; font-weight: 550; color: #6e695f; letter-spacing: .04em; }
        #guide-brief {
            width: 100%; border: 1px solid rgba(22,21,19,.12); border-radius: 0;
            padding: 10px 12px; font-size: 13px; resize: vertical; min-height: 80px;
            font-family: inherit; background: #fff; color: #161513;
        }
        .wendao-guide-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 16px; margin-top: 18px; }
        .wg-primary, .wg-ghost, .wg-text, .wg-close { border: 0; cursor: pointer; font-family: inherit; }
        .wg-primary { background: #3d534b; color: #f7f6f2; border-radius: 980px; min-width: 132px; height: 40px; padding: 0 20px; font-size: 15px; font-weight: 600; }
        .wg-ghost { background: none; color: #6e695f; padding: 0; font-size: 13px; opacity: .7; }
        .wg-ghost:hover { opacity: 1; color: #161513; }
        .wg-text { background: transparent; color: #6e695f; padding: 0; font-size: 12px; opacity: .55; }
        .wg-close { appearance: none; position: absolute; top: 14px; right: 16px; width: auto; margin: 0; background: none; color: #6e695f; font-size: 20px; line-height: 1; opacity: .4; }
        .wg-close:hover { opacity: .85; color: #161513; }
        .ai-chat-thread { display: flex; flex-direction: column; gap: 14px; }
        .ai-chat-empty { margin: 8px 4px; font-size: 12px; color: #6e695f; line-height: 1.5; }
        .ai-src { display: inline-block; margin-top: 6px; font-size: 10px; font-weight: 650; letter-spacing: .06em; color: #3d534b; }
        .ai-src.is-draft { color: #8d6b3d; }
        .ai-write-mark { margin: 6px 0 0; font-size: 11px; font-weight: 650; color: #3d534b; letter-spacing: .02em; line-height: 1.4; }
        .ai-row { display: flex; align-items: flex-start; gap: 8px; max-width: 100%; }
        .ai-row.user { flex-direction: row-reverse; }
        .ai-stack { display: flex; flex-direction: column; gap: 3px; min-width: 0; max-width: calc(100% - 40px); }
        .ai-row.user .ai-stack { align-items: flex-end; }
        .ai-who { font-size: 10px; color: #6e695f; letter-spacing: .04em; padding: 0 2px; line-height: 1.2; }
        .ai-ava {
            width: 32px; height: 32px; flex: none; border-radius: 980px;
            display: grid; place-items: center;
            font-size: 12px; font-weight: 650; letter-spacing: 0;
        }
        .ai-ava.bot { background: #3d534b; color: #f7f6f2; }
        .ai-ava.user { background: #2c2a26; color: #f7f6f2; }
        .ai-bubble { border-radius: 14px; padding: 8px 11px; font-size: 12px; line-height: 1.55; min-width: 0; max-width: 100%; word-break: break-word; }
        .ai-bubble.user { background: #dce6e1; color: #161513; border-radius: 14px 4px 14px 14px; }
        .ai-bubble.bot { background: #fff; border: 1px solid rgba(22,21,19,.08); border-radius: 4px 14px 14px 14px; }
        .ai-bubble.bot.streaming .ai-caret { display: inline-block; width: 0.45em; color: #3d534b; animation: aiCaret 0.9s step-end infinite; }
        @keyframes aiCaret { 50% { opacity: 0; } }
        #wendao-brief-strip {
            flex-shrink: 0;
            border-radius: 14px;
            border: 1px solid rgba(44,42,38,.08);
            background: #e4ebe7;
            color: #2c2a26;
            padding: 12px 14px;
        }
        #wendao-brief-strip p { margin: 0; }
        #wendao-brief-strip .wb-kicker { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #4f6b62; font-weight: 650; }
        #wendao-brief-strip .wb-line { margin-top: 6px; font-size: 13px; line-height: 1.45; }
        #wendao-brief-strip button {
            border: 0; cursor: pointer; font-weight: 600; font-size: 12px;
            border-radius: 980px; padding: 6px 12px; background: #3d534b; color: #f7f6f2;
            flex-shrink: 0;
        }
        .wendao-briefing {
            position: fixed; inset: 0; z-index: 250;
            background: #f3f1ec; color: #2c2a26;
            overflow: auto;
            padding: 28px 22px 48px;
        }
        .wendao-briefing.hidden { display: none !important; }
        .wendao-briefing-inner { max-width: 820px; margin: 0 auto; }

        const GAP_SCORE_MIN = 0;
        const GAP_SCORE_MAX = 5;

        /** 步骤 4 四维差距：0～5 分（越高越成熟）；兼容旧版「缺失/弱/中/强」与快照导入 */
        function legacyGapLabelToScore(s) {
            const t = String(s ?? '').trim();
            if (t === '缺失') return 0;
            if (t === '弱') return 2;
            if (t === '中') return 3;
            if (t === '强') return 5;
            return null;
        }

        function normalizeGapDim(v, fallback) {
            const fb = typeof fallback === 'number' && !isNaN(fallback)
                ? Math.max(GAP_SCORE_MIN, Math.min(GAP_SCORE_MAX, Math.round(fallback)))
                : 3;
            if (v == null || v === '') return fb;
            const lab = legacyGapLabelToScore(v);
            if (lab !== null) return lab;
            const s = String(v).trim();
            const low = s.toLowerCase();
            if (low === 'missing' || low === 'none') return 0;
            if (low === 'weak' || low === 'low') return 2;
            if (low === 'medium' || low === 'mid') return 3;
            if (low === 'strong' || low === 'high') return 5;
            const n = parseFloat(s.replace(/,/g, '.'));
            if (!isNaN(n)) return Math.max(GAP_SCORE_MIN, Math.min(GAP_SCORE_MAX, Math.round(n)));
            return fb;
        }

            if (/订单|oms|交付/.test(n) || /订单|交付/.test(name)) return { l1: '服务交付', l2: '订单履约' };

            fmtAvgEff: '—', fmtAvgQual: '—', fmtAvgCost: '—', fmtAvgRisk: '—', fmtAvgCx: '—'

        function defaultVsStageExtra() {
            const dimActive = {};
            const dimKpiRows = {};
            VS_DIM_KEYS.forEach(k => {
                dimActive[k] = true;
                dimKpiRows[k] = [];
            });
            return {
                valDesc: '',
                dimActive,
                dimKpiRows,
                dEff: 3, dQual: 3, dCost: 3, dRisk: 3, dCx: 3,
                freq: 'mid',
                compliance: 'normal',
                autoPot: 3
            };
        }

        function ensureDimKpiRowsShape(s) {
            if (!s.dimKpiRows || typeof s.dimKpiRows !== 'object') {
                s.dimKpiRows = {};
                VS_DIM_KEYS.forEach(k => { s.dimKpiRows[k] = []; });
            }
            VS_DIM_KEYS.forEach(k => {
                if (!Array.isArray(s.dimKpiRows[k])) s.dimKpiRows[k] = [];
                s.dimKpiRows[k].forEach((row, i) => {
                    if (!row || typeof row !== 'object') return;
                    if (row.id == null || row.id === '') row.id = Date.now() + i;
                    if (row.name == null) row.name = '';
                    if (row.current == null) row.current = '';
                    if (row.target == null) row.target = '';
                });
            });
        }

        function ensureVsStageShape(s) {
            if (!s || typeof s !== 'object') return;
            const ex = defaultVsStageExtra();
            if (s.valDesc === undefined || s.valDesc === null) s.valDesc = '';
            if (!s.dimActive || typeof s.dimActive !== 'object') s.dimActive = { ...ex.dimActive };
            VS_DIM_KEYS.forEach(k => {
                if (typeof s.dimActive[k] !== 'boolean') s.dimActive[k] = true;
            });
            if (!VS_DIM_KEYS.some(k => s.dimActive[k])) s.dimActive.dEff = true;
            ensureDimKpiRowsShape(s);
            VS_DIM_KEYS.forEach(k => {
                let n = parseInt(s[k], 10);
                if (isNaN(n)) n = ex[k];
                s[k] = Math.max(1, Math.min(5, n));
            });
            let ap = parseInt(s.autoPot, 10);
            if (isNaN(ap)) ap = ex.autoPot;
            s.autoPot = Math.max(1, Math.min(5, ap));
            if (!['high', 'mid', 'low'].includes(s.freq)) s.freq = 'mid';
            if (!['low', 'normal', 'high'].includes(s.compliance)) s.compliance = 'normal';
        }

            const arr = currentState.vsStages || [];
            if (!arr.length) {
                currentState.vsSelectedStageId = null;
                return;
            }
            const sid = currentState.vsSelectedStageId;
            if (sid == null || !arr.some(st => st.id === sid)) {
                currentState.vsSelectedStageId = arr[0].id;
            }

            if (!currentState.vsStages.some(s => s.id === id)) return;
            currentState.vsSelectedStageId = id;
            renderStep2();
        }

        function addVsDimKpiRow(stageId, dimKey) {
            const s = currentState.vsStages.find(x => x.id === stageId);
            if (!s || !VS_DIM_KEYS.includes(dimKey)) return;
            ensureDimKpiRowsShape(s);
            s.dimKpiRows[dimKey].push({ id: Date.now() + Math.floor(Math.random() * 999), name: '', current: '', target: '' });
            renderStep2();
        }

        function removeVsDimKpiRow(stageId, dimKey, rowId) {
            const s = currentState.vsStages.find(x => x.id === stageId);
            if (!s || !VS_DIM_KEYS.includes(dimKey) || !s.dimKpiRows || !s.dimKpiRows[dimKey]) return;
            const rid = typeof rowId === 'number' ? rowId : parseInt(rowId, 10);
            s.dimKpiRows[dimKey] = s.dimKpiRows[dimKey].filter(r => r.id !== rid);
            renderStep2();
        }

        function updateVsDimKpiRow(stageId, dimKey, rowId, field, value) {
            const s = currentState.vsStages.find(x => x.id === stageId);
            if (!s || !VS_DIM_KEYS.includes(dimKey) || !['name', 'current', 'target'].includes(field)) return;
            ensureDimKpiRowsShape(s);
            const rid = typeof rowId === 'number' ? rowId : parseInt(rowId, 10);
            const row = s.dimKpiRows[dimKey].find(r => r.id === rid);
            if (!row) return;
            row[field] = value;
            renderStep2();
        }

        function normalizeVsDimWeightsInPlace() {
            const w = currentState.vsDimWeights;
            if (!w || typeof w !== 'object') {
                currentState.vsDimWeights = { ...VS_DIM_WEIGHT_DEFAULTS };
                return;
            }
            let sum = VS_DIM_KEYS.reduce((a, k) => a + (parseFloat(w[k]) || 0), 0);
            if (sum <= 0) {
                VS_DIM_KEYS.forEach(k => { w[k] = VS_DIM_WEIGHT_DEFAULTS[k]; });
                return;
            }
            VS_DIM_KEYS.forEach(k => { w[k] = (parseFloat(w[k]) || 0) / sum; });
        }

        function ensureAllVsStagesShape() {
            if (!currentState.vsDimWeights || typeof currentState.vsDimWeights !== 'object') {
                currentState.vsDimWeights = { ...VS_DIM_WEIGHT_DEFAULTS };
            }
            VS_DIM_KEYS.forEach(k => {
                if (currentState.vsDimWeights[k] == null || isNaN(parseFloat(currentState.vsDimWeights[k]))) {
                    currentState.vsDimWeights[k] = VS_DIM_WEIGHT_DEFAULTS[k];
                }
            });
            normalizeVsDimWeightsInPlace();
            (currentState.vsStages || []).forEach(ensureVsStageShape);
        }

        function computeStageHealthPct(s) {
            let sum = 0;
            let n = 0;
            VS_DIM_KEYS.forEach(k => {
                if (!s.dimActive || !s.dimActive[k]) return;
                sum += parseInt(s[k], 10) || 3;
                n++;
            });
            if (!n) return null;
            return Math.round((sum / n / 5) * 1000) / 10;
        }

        function vsStageWeakestDim(s) {
            let minK = null;
            let minSc = 99;
            VS_DIM_KEYS.forEach(k => {
                if (!s.dimActive || !s.dimActive[k]) return;
                const sc = parseInt(s[k], 10) || 3;
                if (sc < minSc) {
                    minSc = sc;
                    minK = k;
                }
            });
            if (!minK) return null;
            return { key: minK, score: minSc, label: VS_DIM_LABELS[minK] };
        }

        function vsStageDiagnosisLine(s) {
            const w = vsStageWeakestDim(s);
            if (!w) return '请勾选至少一项维度';
            if (w.score >= 4) return '已选维度整体尚可';
            return `${w.label}偏弱 · ${VS_DIM_ADVICE[w.key]}`;
        }

        function avgDimAcrossStages(dimKey) {
            let sum = 0;
            let n = 0;
            (currentState.vsStages || []).forEach(s => {
                if (!s.dimActive || !s.dimActive[dimKey]) return;
                sum += parseInt(s[dimKey], 10) || 3;
                n++;
            });
            if (!n) return null;
            return Math.round((sum / n) * 10) / 10;
        }

        function toggleVsStageDim(id, dimKey, checked) {
            const s = currentState.vsStages.find(x => x.id === id);
            if (!s || !VS_DIM_KEYS.includes(dimKey)) return;
            if (!s.dimActive) s.dimActive = {};
            s.dimActive[dimKey] = !!checked;
            if (!VS_DIM_KEYS.some(k => s.dimActive[k])) {
                s.dimActive[dimKey] = true;
                toast('每个阶段至少保留一个维度', 'error');
            }
            if (checked) {
                ensureDimKpiRowsShape(s);
                if (!s.dimKpiRows[dimKey].length) {
                    s.dimKpiRows[dimKey].push({ id: Date.now(), name: '', current: '', target: '' });

            calcVSMetrics();
            renderStep2();

        function healthHeatClass(pct) {

            let sessionKey = '';

                const o = JSON.parse(raw);
                if (o.apiKey && !sessionKey) {

                    try {

                            endpoint: String(o.endpoint || '').trim(),
                            model: String(o.model || '').trim(),
                            provider: String(o.provider || '').trim()
                        }));
                    } catch (e3) { /* ignore */ }

                return {
                    endpoint: String(o.endpoint || '').trim(),
                    apiKey: sessionKey,
                    model: String(o.model || 'deepseek-v4-flash').trim() || 'deepseek-v4-flash'

        async function saveAiConfigFromForm() {
            let endpoint = document.getElementById('ai-cfg-endpoint')?.value?.trim() || '';
            const apiKey = String(document.getElementById('ai-cfg-apikey')?.value || '')
                .trim().replace(/^['"“”‘’]+|['"“”‘’]+$/g, '').replace(/^Bearer\s+/i, '').trim();
            let model = document.getElementById('ai-cfg-model')?.value?.trim() || '';
            const guessed = window.YouweiAi && YouweiAi.guessProvider ? YouweiAi.guessProvider(apiKey, endpoint) : null;
            if (apiKey && !endpoint && guessed) {
                endpoint = guessed.endpoint;
                if (!model) model = guessed.model;
                applyAiProviderPreset(guessed.id, true);
            }
            if (apiKey && !endpoint) {
                toast('请先点选 Key 所属平台', 'error');
                return;
            }
            const provider = ((window.YouweiAi && YouweiAi.providerOf && YouweiAi.providerOf(endpoint)) || {}).id || (guessed && guessed.id) || '';
            const typed = apiKey;
            const existing = (window.YouweiAi && YouweiAi.loadConfig().apiKey) || loadAiConfig().apiKey || '';
            const keyToUse = typed || existing;
            const payload = { endpoint, apiKey: keyToUse, model, provider };
            try {
                if (window.YouweiAi) YouweiAi.saveLocal(payload);
                else {
                    localStorage.setItem(AI_CONFIG_LS, JSON.stringify({ endpoint, model, provider }));
                    if (keyToUse) sessionStorage.setItem('youwei_ai_key_session_v1', keyToUse);
                }
                if (window.YouweiOps && YouweiOps.patch) YouweiOps.patch({ ai: { endpoint, model, provider } });
            } catch (e) {
                toast('保存失败', 'error');
                return;
            }
            refreshAiAssistantUi();
            if (!window.YouweiAi || !YouweiAi.probeConnection) {
                toast('已保存');
                return;
            }
            toast('正在试连…');
            const r = await YouweiAi.probeConnection();
            toast(r.message, r.ok ? undefined : 'error');
            const badge = document.getElementById('ai-mode-badge');
            if (badge) badge.textContent = r.ok ? ('已连通 ' + ((window.YouweiAi.providerOf && YouweiAi.providerOf(endpoint) || {}).name || '')) : '未连通，请改选平台';
        }

        function restrictWorkflowPatchToStep(wp, stepId) {

            if (sid === 2) {

                if (wp.vsStageInsights && wp.vsStageInsights.length) out.vsStageInsights = wp.vsStageInsights;
                if (wp.workflowIndustry) out.workflowIndustry = wp.workflowIndustry;
                return Object.keys(out).length > 1 ? out : null;
            }
            if (sid === 3) {

                if (wp.capabilityInsights && wp.capabilityInsights.length) out.capabilityInsights = wp.capabilityInsights;

        function extractWorkflowPatchFromText(text) {
            if (!text || typeof text !== 'string') return null;
            const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
            const tryObj = (raw) => {
                try {
                    const o = JSON.parse(raw);
                    if (o && typeof o.workflowPatch === 'object' && o.workflowPatch !== null) return o.workflowPatch;
                } catch (e) { /* ignore */ }
                return null;
            };
            if (fence) {
                const wp = tryObj(fence[1].trim());
                if (wp) return wp;
            }
            const keyIdx = text.indexOf('"workflowPatch"');
            if (keyIdx !== -1) {
                const colon = text.indexOf(':', keyIdx);
                const open = colon !== -1 ? text.indexOf('{', colon) : -1;
                if (open !== -1) {
                    let depth = 0;
                    for (let i = open; i < text.length; i++) {
                        const ch = text[i];
                        if (ch === '{') depth++;
                        else if (ch === '}') {
                            depth--;
                            if (depth === 0) {
                                const inner = text.slice(open, i + 1);
                                const wp = tryObj('{"workflowPatch":' + inner + '}');
                                if (wp) return wp;
                                break;
                            }
                        }
                    }
                }
            }
            return null;
        }

        /** 业务能力「价值流阶段」列：与工作流2流程简图中细分阶段 name 对齐；去掉「价值流名→阶段」旧写法；空则按各阶段业务组件精确匹配 l3 */
        function normalizeCapabilityLinkedVs(rawLinkedVs, l3) {
            let v = String(rawLinkedVs ?? '').trim();
            if (v && (/→/.test(v) || /->/.test(v))) {
                const seg = v.split(/\s*(?:→|->)\s*/).map(s => s.trim()).filter(Boolean);
                if (seg.length >= 2) v = seg[seg.length - 1];
            }
            if (v) return v;
            const name = String(l3 ?? '').trim();
            if (!name) return '';
            for (const st of currentState.vsStages || []) {
                const parts = String(st.components || '').split(/[,，]/).map(x => x.trim()).filter(Boolean);
                if (parts.includes(name)) {
                    return String(st.name || '').trim() || `阶段 ${st.id}`;
                }
            }
            return '';
        }

        function normalizeDiagnosticRuleScore(raw) {
            const n = parseInt(raw, 10);
            if (isNaN(n)) return 10;
            return Math.max(0, Math.min(100, n));
        }

        /** @returns {boolean} 是否成功写入至少一条规则 */
        function applyCanvasDiagnosticRulesFromAiPatch(rows) {
            if (!Array.isArray(rows) || !rows.length) return false;
            const baseId = Date.now();
            const out = [];
            rows.forEach((raw, idx) => {
                const field = normalizeBmcFieldKeyFromCell(String(raw.field || '')) || '';
                const keyword = String(raw.keyword || '').trim();
                const message = String(raw.message || '').trim();
                if (!field || !keyword || !message) return;
                let compareField = String(raw.compareField ?? 'none').trim();
                if (!compareField || /^none$/i.test(compareField)) compareField = 'none';
                else compareField = normalizeBmcFieldKeyFromCell(compareField) || 'none';
                let compareKeyword = String(raw.compareKeyword || '').trim();
                if (compareField !== 'none' && !compareKeyword) compareField = 'none';
                if (compareField === 'none') compareKeyword = '';
                const score = normalizeDiagnosticRuleScore(raw.score);
                out.push({
                    id: baseId + idx,
                    field,
                    keyword,
                    message,
                    score,
                    compareField,
                    compareKeyword
                });
            });
            if (!out.length) return false;
            currentState.rules = out;
            return true;
        }

        /** @returns {{ ok: boolean, summary?: string }} */
        function applyWorkflowPatchObject(wp) {
            if (!wp || typeof wp !== 'object') return { ok: false };
            const touched = { bmc: false, vs: false, cap: false, ini: false, roadmap: false, cfg: false };
            const parts = [];
            if (wp.roadmap && typeof wp.roadmap === 'object') {
                applyRoadmapFromAiPatch(wp.roadmap);
                touched.roadmap = true;
                parts.push('路标时间轴');
            }
            if (wp.bmc && typeof wp.bmc === 'object') {
                FIELD_ORDER.forEach(k => {
                    if (wp.bmc[k] != null && wp.bmc[k] !== '') currentState.bmc[k] = String(wp.bmc[k]);
                });
                currentState.bmcReport = null;
                touched.bmc = true;
                parts.push('商业画布');
            }
            if (wp.valueStreamName != null && String(wp.valueStreamName).trim() !== '' && (!wp.stages || !wp.stages.length)) {
                currentState.valueStreamName = String(wp.valueStreamName).trim();
                touched.vs = true;
                parts.push('价值流名称');
            }
            if (wp.stages && wp.stages.length) {
                applyStagesFromAiPatch(wp.stages, wp.valueStreamName);
                touched.vs = true;
                parts.push('价值流阶段');
            }
            if (wp.capabilities && wp.capabilities.length) {
                applyCapabilitiesFromAiPatch(wp.capabilities);
                touched.cap = true;
                parts.push('能力架构');
            }
            if (wp.capabilityGaps && wp.capabilityGaps.length) {
                mergeCapabilityGapsFromAiPatch(wp.capabilityGaps);
                touched.cap = true;
                parts.push('差距四维');
            }
            if (wp.vsStageInsights && wp.vsStageInsights.length) {
                mergeVsStageInsightsFromAiPatch(wp.vsStageInsights);
                touched.vs = true;
                parts.push('价值流五维');
            }
            if (wp.capabilityInsights && wp.capabilityInsights.length) {
                mergeCapabilityInsightsFromAiPatch(wp.capabilityInsights);
                touched.cap = true;
                parts.push('能力表述');
            }
            if (wp.initiatives && wp.initiatives.length) {
                applyInitiativesFromAiPatch(wp.initiatives);
                touched.ini = true;
                parts.push('变革举措');
            }
            if (wp.workflowIndustry != null && WORKFLOW_INDUSTRIES.includes(String(wp.workflowIndustry).trim())) {
                currentState.workflowIndustry = String(wp.workflowIndustry).trim();
                touched.vs = true;
                parts.push('工作流行业');

        /** AI 助手抽屉：按住标题区拖动，避免遮挡工作台（保留右下角默认定位直至首次拖动） */
        function bindAiDrawerDrag() {
            const drawer = document.getElementById('ai-assistant-drawer');
            const handle = document.getElementById('ai-drawer-drag-handle');
            if (!drawer || !handle || handle.dataset.dragBound === '1') return;
            handle.dataset.dragBound = '1';

            let dragging = false;
            let startX = 0;
            let startY = 0;
            let startLeft = 0;
            let startTop = 0;

            function ensureLeftTopFromCurrentRect() {
                if (drawer.style.left && drawer.style.top) return;
                const r = drawer.getBoundingClientRect();
                drawer.style.right = 'auto';
                drawer.style.bottom = 'auto';
                drawer.style.left = `${Math.round(r.left)}px`;
                drawer.style.top = `${Math.round(r.top)}px`;
            }

            function startDrag(clientX, clientY) {
                dragging = true;
                ensureLeftTopFromCurrentRect();
                const rect = drawer.getBoundingClientRect();
                startLeft = rect.left;
                startTop = rect.top;
                startX = clientX;
                startY = clientY;
                handle.classList.add('ai-drawer-dragging');
            }

            function moveDrag(clientX, clientY) {
                if (!dragging) return;
                const dx = clientX - startX;
                const dy = clientY - startY;
                let nl = startLeft + dx;
                let nt = startTop + dy;
                const w = drawer.offsetWidth;
                const h = drawer.offsetHeight;
                const pad = 8;
                const vw = document.documentElement.clientWidth;
                const vh = document.documentElement.clientHeight;
                nl = Math.max(pad, Math.min(nl, vw - w - pad));
                nt = Math.max(pad, Math.min(nt, vh - h - pad));
                drawer.style.left = `${Math.round(nl)}px`;
                drawer.style.top = `${Math.round(nt)}px`;
            }

            function endDrag() {
                if (!dragging) return;
                dragging = false;
                handle.classList.remove('ai-drawer-dragging');
            }

            handle.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                startDrag(e.clientX, e.clientY);
                e.preventDefault();
            });
            window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
            window.addEventListener('mouseup', endDrag);

            handle.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;
                const t = e.touches[0];
                startDrag(t.clientX, t.clientY);
            }, { passive: true });
            window.addEventListener('touchmove', (e) => {
                if (!dragging || e.touches.length !== 1) return;
                e.preventDefault();
                const t = e.touches[0];
                moveDrag(t.clientX, t.clientY);
            }, { passive: false });
            window.addEventListener('touchend', endDrag);
            window.addEventListener('touchcancel', endDrag);
        }

        /** 从快照提取资产列表行所需的 7 步核心摘要 */
        function summarizeSnapshotForAssetsRow(snap) {
            if (!snap || typeof snap !== 'object') snap = {};
            const bmc = snap.bmc || {};
            const vp = String(bmc.valuePropositions || '').replace(/\s+/g, ' ').trim();
            const cust = String(bmc.customerSegments || '').replace(/\s+/g, ' ').trim();
            const s1 = vp ? vp.slice(0, 56) + (vp.length > 56 ? '…' : '') : (cust ? `细分：${cust.slice(0, 40)}` : '—');
            const vsName = String(snap.valueStreamName || '—').trim();
            const stages = snap.vsStages || [];
            const s2 = stages.length ? `${vsName} · ${stages.length} 阶段` : `${vsName} · 未生成阶段`;
            const cf = snap.capabilityFramework || [];
            let r = 0, y = 0, g = 0;
            cf.forEach(c => {
                const cat = heatCategory(c);
                if (cat === 'red') r++;
                else if (cat === 'yellow') y++;
                else g++;
            });
            const s3 = cf.length ? `${cf.length} 项能力块` : '—';
            const weakDims = cf.filter(c => {
                const def = CAPABILITY_DB[c.l3] || CAPABILITY_DB.default;
                const o = normalizeGapDim(c.gapOrg, gapFromMat(def.mat.o));
                const p = normalizeGapDim(c.gapProc, gapFromMat(def.mat.p));
                return o <= 2 || p <= 2;
            }).length;
            const s4 = cf.length ? `四维差距已填 · ${weakDims} 项偏弱维` : '—';
            const s5 = cf.length ? `红 ${r} / 黄 ${y} / 绿 ${g}` : '—';
            const ini = snap.initiatives || [];
            const ph = { P0: 0, P1: 0, P2: 0 };
            ini.forEach(i => {
                if (ph[i.phase] != null) ph[i.phase]++;
            });
            const s6 = ini.length ? `${ini.length} 条 · P0 ${ph.P0} / P1 ${ph.P1} / P2 ${ph.P2}` : '—';
            const rs = snap.roadmapStartYm || '';
            const rm = snap.roadmapMonths;
            const s7 = rs && rm ? `${rs} 起 · ${rm} 个月` : '—';
            return { s1, s2, s3, s4, s5, s6, s7, s1full: vp || cust || '—' };
        }

                    await waitForLayoutMs(90);
                    const w = Math.max(el.scrollWidth, el.offsetWidth, 960);
                    const h = Math.max(el.scrollHeight, el.offsetHeight, 420);
                    const scale = Math.min(1.6, 3200 / Math.max(h, 1), 2200 / Math.max(w, 1));
                    const canvas = await h2c(el, {
                        backgroundColor: '#ffffff',
                        scale: scale,
                        useCORS: true,
                        logging: false,
                        width: w,
                        height: h,
                        windowWidth: w,
                        windowHeight: h
                    });
                    const meta = getStepMeta(i);
                    shots.push({
                        step: i,
                        title: meta ? meta.title : ('步骤 ' + i),

                return x === '企业名称' || x === '评估项目' || x === '规划周期' || x === '负责人';
            });
            currentState.activePanel = 'workflow';
            currentState.step = needEngage ? 1 : 6;
            if (needEngage) {
                try { localStorage.setItem(ENGAGE_COLLAPSE_LS, '0'); } catch (e) { /* ignore */ }
            }
            renderNav();
            renderStepProgress();
            renderStep();
            if (needEngage) {
                const card = document.getElementById('p0-engage-card');
                if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        /** 步骤 7 底部「保存」：门槛通过后写入底稿，并生成带结论页的评估过程册 */
        async function saveBlueprintHistory() {
            if (currentState.step !== STEP_TOTAL || currentState.activePanel !== 'workflow') return;
            if (!currentState.initiatives.length) {
                toast('请先完成前面的步骤并生成举措与路标数据后再保存', 'error');
                return;
            }
            const miss = (window.YouweiReport && YouweiReport.missingProcessBookGate)
                ? YouweiReport.missingProcessBookGate(currentState)
                : missingEngagementFields();
            if (miss.length) {
                toast('过程册还不能外发，请先补齐：' + miss.join('、'), 'error');
                jumpAfterBookGate(miss);
                return;
            }
            const assetsCfg = window.YouweiOps && YouweiOps.getAssets ? YouweiOps.getAssets() : {};
            const wm = currentState.workspaceMeta || {};
            const defaultTitle = String(assetsCfg.titlePattern || '{org} · {project} · {date}')
                .replace('{org}', wm.organizationName || '企业')
                .replace('{project}', wm.projectName || currentState.valueStreamName || '评估')
                .replace('{date}', new Date().toLocaleString('zh-CN', { hour12: false }));
            const input = window.prompt('为该保存版本命名（留空则使用默认名称）', defaultTitle);
            if (input === null) return;
            const title = (input || '').trim() || defaultTitle;
            const id = Date.now();
            const snapshot = getSerializableWorkflowSnapshot();
            const record = {
                id: id,
                savedAt: new Date().toISOString(),
                title: title,
                snapshot: snapshot,
                packId: null
            };
            const list = loadBlueprintHistoryList();
            list.unshift(record);
            saveBlueprintHistoryList(list);
            renderSidebarHistoryPanel();
            if (!window.YouweiPack || !YouweiPack.buildAndStore) {
                toast('已保存底稿。过程册组件未加载');
                if (window.YouweiP2 && YouweiP2.afterSaveVisit) YouweiP2.afterSaveVisit();
                return;
            }
            toast('正在按评估数据生成过程册…', 'loading');
            try {
                await YouweiPack.buildAndStore(id, title, snapshot);
                const next = loadBlueprintHistoryList();
                const row = next.find(function (r) { return r.id === id; });
                if (row) row.packId = id;
                saveBlueprintHistoryList(next);
                toast('过程册已生成，可下载 HTML 发给客户');
                if (isAssetsLibraryOpen()) renderAssetsStandaloneContent();
                await YouweiPack.open(id);
                if (window.YouweiP2 && YouweiP2.afterSaveVisit) YouweiP2.afterSaveVisit();
            } catch (e) {
                console.error(e);
                toast((e && e.message) || '过程册未生成，底稿已保存', 'error');
            }
        }

        function deleteHistoryRecord(id) {
            const assetsCfg = window.YouweiOps && YouweiOps.getAssets ? YouweiOps.getAssets() : {};
            if (assetsCfg.allowClientDelete === false && !(window.YouweiAuth && YouweiAuth.isAdmin && YouweiAuth.isAdmin())) {

        /** 根据历史快照生成独立 HTML 文件（导出完成后恢复当前编辑状态） */
        async function exportHtmlFromHistoryRecord(recordId) {
            const rec = loadBlueprintHistoryList().find(r => r.id === recordId);
            if (!rec || !rec.snapshot) {
                toast('记录不存在', 'error');
                return;
            }
            const backupSnap = getSerializableWorkflowSnapshot();
            const backupStep = currentState.step;
            const backupPanel = currentState.activePanel;
            try {
                applyWorkflowSnapshot(rec.snapshot);
                currentState.activePanel = 'workflow';
                currentState.step = STEP_TOTAL;
                renderNav();
                renderStepProgress();
                const fname = `BA_${sanitizeExportFilenameBase(rec.title)}_${String(rec.id).slice(-8)}.html`;
                await runHtmlExportCore(fname);
            } finally {
                applyWorkflowSnapshot(backupSnap);
                currentState.step = backupStep;
                currentState.activePanel = backupPanel;
                renderNav();
                renderStepProgress();
                renderStep();
                renderSidebarHistoryPanel();

            const byName = names.find(n => n === '商业画布' || /^商业画布/.test(n));

            return wb.Sheets[other || names[0]];

        function exportBmcExcel() {
            if (typeof XLSX === 'undefined') {
                toast('未加载表格库，请检查网络后重试', 'error');
                return;
            }
            const stamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, '');
            const wb = XLSX.utils.book_new();
            const head = ['字段键（勿改，导入据此匹配）', '字段名称', '填写内容'];
            const data = [head, ...FIELD_ORDER.map(k => [k, FIELD_MAP[k], (currentState.bmc[k] != null ? String(currentState.bmc[k]) : '')])];
            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [{ wch: 32 }, { wch: 16 }, { wch: 64 }];
            XLSX.utils.book_append_sheet(wb, ws, '商业画布');

        function pickConfigWorksheet(wb, candidates) {
            const names = wb.SheetNames || [];
            for (const c of candidates) {
                const hit = names.find(n => n === c || String(n).replace(/\s/g, '') === String(c).replace(/\s/g, ''));

            }
            return null;

        function parseRulesFromConfigMatrix(matrix) {
            const rules = [];
            let baseId = Date.now();
            for (let i = 0; i < matrix.length; i++) {
                const row = matrix[i];
                if (!row || row.length === 0) continue;
                const c0 = String(row[0] ?? '').trim();
                const c1 = String(row[1] ?? '').trim();
                if (i === 0 && (c0.includes('field') || c0.includes('字段') || c0.includes('键'))) continue;
                let field = normalizeBmcFieldKeyFromCell(c0);
                if (!field && c1) field = normalizeBmcFieldKeyFromCell(c1);
                const keyword = String(row[2] ?? '').trim();
                let compareFieldRaw = String(row[3] ?? '').trim();
                const compareZh = String(row[4] ?? '').trim();
                const compareKeyword = String(row[5] ?? '').trim();
                const scoreRaw = row[6];
                const message = String(row[7] ?? '').trim();
                if (!field || !keyword || !message) continue;
                let compareField = compareFieldRaw;
                if (!compareField || compareField === '无' || compareField === '-' || /^none$/i.test(compareField)) {
                    compareField = 'none';
                } else {
                    compareField = normalizeBmcFieldKeyFromCell(compareField) || normalizeBmcFieldKeyFromCell(compareZh) || 'none';
                }
                if (compareField !== 'none' && !compareKeyword) compareField = 'none';
                const score = parseInt(scoreRaw, 10);
                rules.push({
                    id: baseId++,
                    field,
                    keyword,
                    compareField,
                    compareKeyword: compareField === 'none' ? '' : compareKeyword,
                    message,
                    score: isNaN(score) ? 10 : Math.max(0, Math.min(100, score))
                });
            }
            return rules;
        }

        function parseTemplatesFromConfigMatrix(matrix) {
            const header = matrix[0] || [];
            const industryColRecognized = header.length > 8 && (/适用|行业/.test(String(header[8] ?? '')) || String(header[8] ?? '').trim().length > 0);
            const groups = new Map();
            let currentKey = null;
            for (let i = 0; i < matrix.length; i++) {
                const row = matrix[i];
                if (!row || row.length === 0) continue;
                const keyCell = String(row[0] ?? '').trim();
                const nameCell = String(row[1] ?? '').trim();
                const stageName = String(row[3] ?? '').trim();
                const typeRaw = String(row[4] ?? '').trim().toLowerCase();
                const defaultTime = parseInt(row[5], 10);
                const scenarios = String(row[6] ?? '');
                const components = String(row[7] ?? '');
                const industryCell = row.length > 8 ? row[8] : '';
                if (i === 0 && (keyCell.includes('模板键') || keyCell.includes('模板'))) continue;
                if (keyCell) {
                    currentKey = keyCell;
                    if (!groups.has(currentKey)) {
                        groups.set(currentKey, { name: nameCell || currentKey, stages: [], industrySet: new Set() });
                    } else if (nameCell) {
                        groups.get(currentKey).name = nameCell;
                    }
                }
                if (!currentKey || !stageName) continue;
                if (!groups.has(currentKey)) {
                    groups.set(currentKey, { name: nameCell || currentKey, stages: [], industrySet: new Set() });
                }
                const g = groups.get(currentKey);
                if (nameCell) g.name = nameCell;
                parseIndustryTagsFromConfigCell(industryCell).forEach(x => g.industrySet.add(x));
                const type = typeRaw === 'wait' ? 'wait' : 'process';
                const dt = isNaN(defaultTime) ? 1 : Math.max(0, defaultTime);
                g.stages.push({
                    id: g.stages.length + 1,
                    name: stageName,
                    type,
                    defaultTime: dt,
                    scenarios: scenarios.trim(),
                    components: components.trim()
                });
            }
            const out = {};
            groups.forEach((v, k) => {
                if (!v.stages.length) return;
                v.stages.forEach((s, idx) => { s.id = idx + 1; });
                const inds = [...v.industrySet];
                out[k] = { name: v.name || k, stages: v.stages };
                if (inds.length) out[k].industries = inds;
            });
            return { parsed: out, mergePreserveIndustry: !industryColRecognized };
        }

        function parseCapabilityFrameworkFromMatrix(matrix) {
            const out = [];
            for (let i = 0; i < matrix.length; i++) {
                const row = matrix[i];
                if (!row || row.length === 0) continue;
                const c0 = String(row[0] ?? '').trim();
                if (i === 0 && (c0.includes('价值流') || c0.includes('业务能力') || c0.includes('L3'))) continue;
                const l3 = String(row[1] ?? '').trim();
                if (!l3) continue;
                const linkedVs = normalizeCapabilityLinkedVs(String(row[0] ?? '').trim(), l3);
                let desc = row[2] != null ? String(row[2]) : '';
                if (!String(desc).trim()) desc = defaultCapabilityL3Desc(l3, linkedVs);
                const l1 = String(row[3] ?? '').trim();
                const l2 = String(row[4] ?? '').trim();
                let curMat = parseInt(row[5], 10);
                let tgtMat = parseInt(row[6], 10);
                if (isNaN(curMat)) curMat = 3;
                if (isNaN(tgtMat)) tgtMat = Math.min(5, curMat + 2);
                curMat = Math.max(1, Math.min(5, curMat));
                tgtMat = Math.max(1, Math.min(5, tgtMat));
                const def = CAPABILITY_DB[l3] || CAPABILITY_DB.default;
                const hasGapCols = row.length >= 12;
                const gapOrg = normalizeGapDim(hasGapCols ? row[8] : '', gapFromMat(def.mat.o));
                const gapProc = normalizeGapDim(hasGapCols ? row[9] : '', gapFromMat(def.mat.p));
                const gapData = normalizeGapDim(hasGapCols ? row[10] : '', gapFromMat(def.mat.d));
                const gapIt = normalizeGapDim(hasGapCols ? row[11] : '', gapFromMat(def.mat.i));
                let iceStr = '';
                const iceRaw = row[7];
                if (iceRaw != null && String(iceRaw).trim() !== '') {
                    const x = parseFloat(iceRaw);
                    iceStr = isNaN(x) ? (def.pri.v * 0.4 + def.pri.u * 0.4 + def.pri.f * 0.2).toFixed(1) : parseFloat(x).toFixed(1);
                } else {
                    iceStr = (def.pri.v * 0.4 + def.pri.u * 0.4 + def.pri.f * 0.2).toFixed(1);
                }
                const sys = row.length >= 13 && String(row[12] ?? '').trim() ? String(row[12]).trim() : def.sys;
                const tech = row.length >= 14 && String(row[13] ?? '').trim() ? String(row[13]).trim() : def.tech;
                const scenarioGapProfiles = row.length >= 15 ? parseScenarioGapProfilesJsonCell(row[14]) : [];
                out.push({
                    linkedVs,
                    l3,
                    desc,
                    l1,
                    l2,
                    curMat,
                    tgtMat,
                    ice: iceStr,
                    gapOrg,
                    gapProc,
                    gapData,
                    gapIt,
                    sys,
                    tech,
                    scenarioGapProfiles
                });
            }
            out.sort((a, b) => parseFloat(b.ice) - parseFloat(a.ice));
            return out;
        }

            input.value = '';
            if (!file) return;
            if (typeof XLSX === 'undefined') {
                toast('未加载表格库，请检查网络后重试', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const buf = new Uint8Array(e.target.result);
                    const wb = XLSX.read(buf, { type: 'array' });
                    const ws = pickCapabilityFrameworkSheet(wb);
                    if (!ws) {
                        toast('未找到「业务能力架构」工作表', 'error');
                        return;
                    }
                    const matrix = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
                    const parsed = parseCapabilityFrameworkFromMatrix(matrix);
                    if (!parsed.length) {
                        toast('未解析到有效行：请确认「业务能力L3」列有内容', 'error');
                        return;
                    }
                    currentState.capabilityFramework = parsed.map((c, idx) => ({
                        id: idx + 1,
                        ...c
                    }));
                    migrateCapabilityFrameworkGapScores();
                    renderStep3();
                    renderStep4();
                    renderStep5();
                    toast(`已导入 ${parsed.length} 条能力块`);
                } catch (err) {
                    console.error(err);
                    toast('导入失败：请使用本页导出的 xlsx 或核对列结构', 'error');
                }
            };
            reader.onerror = () => toast('读取文件失败', 'error');
            reader.readAsArrayBuffer(file);
        }

        function methodBlock(key) {

                    <span class="min-w-0"><i class="fas fa-book-open text-ink-tertiary mr-2 text-[11px]" aria-hidden="true"></i>步骤说明<span class="font-normal text-ink-secondary">（点击展开）</span></span>
