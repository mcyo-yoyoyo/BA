            /* 左侧工作流展开宽度（较原 280px 缩减 40% → 168px） */

        }

        body { zoom: 1; }
        body.pdf-exporting { zoom: 1 !important; }
        body { -webkit-font-smoothing: antialiased; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pdf-mode-active {
            position: absolute; top: 0; left: 0; right: 0; z-index: 9999;

        }
        .pdf-mode-active .step-wrapper { display: block !important; flex: none !important; margin-bottom: 40px; page-break-after: always; }

        .heat-yellow { background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 100%); border-color: rgba(180,83,9,0.2); }
        .heat-green { background: linear-gradient(180deg, #f0fdf4 0%, #dcfce7 100%); border-color: rgba(22,163,74,0.22); }
        .ui-table-wrap { border: 1px solid rgba(0,0,0,0.06); border-radius: 12px; overflow: hidden; background: #fff; }
        .ui-table-wrap table thead { background: #fafafa; }

        .roadmap-gantt-scroll { --rg-months: 24; }

            position: relative;
            min-height: 28px;
            background-image: repeating-linear-gradient(
                90deg,
                transparent 0,
                transparent calc(100% / var(--rg-months, 24) - 1px),
                rgba(0, 0, 0, 0.06) calc(100% / var(--rg-months, 24) - 1px),
                rgba(0, 0, 0, 0.06) calc(100% / var(--rg-months, 24))

        }
        .roadmap-gantt-bar {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            height: 18px;

            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);

        .roadmap-gantt-bar.sm { height: 14px; border-radius: 5px; }
        @media print {
            .roadmap-gantt-scroll { overflow: visible !important; }

        /* PDF 导出时解除一屏高度限制，避免截图被裁切 */
        body.pdf-exporting,
        body.pdf-exporting #workspace,
        body.pdf-exporting #workspace-scroll {
            overflow: visible !important;
            height: auto !important;
            max-height: none !important;
        }
        /* 禁止改为 display:block：会破坏 body→main 的 flex 分配，导致 grid 行高 1fr 塌成 0，html2canvas 截图尺寸为 0 */
        body.pdf-exporting.app-shell {
            display: flex !important;
            flex-direction: column !important;
            height: auto !important;
            min-height: 100vh !important;
            max-height: none !important;
            overflow: visible !important;

        body.pdf-exporting.app-shell > header {

        }

            height: 52px;
            border-radius: 9999px;

            justify-content: center;

        .ai-assistant-float-btn:hover { transform: scale(1.05); box-shadow: 0 6px 24px rgba(0, 113, 227, 0.42); }
        .ai-assistant-drawer {
            position: fixed;
            right: max(12px, env(safe-area-inset-right));
            bottom: max(84px, env(safe-area-inset-bottom));
            z-index: 209;
            width: min(432px, calc(100vw - 20px));
            max-height: min(91vh, 702px);
            display: flex;
            flex-direction: column;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: #fff;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }
        .ai-assistant-drawer.hidden { display: none !important; }
        .ai-drawer-drag-handle {
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

            cursor: grabbing;
        }

        body.pdf-exporting.app-shell > #main-layout {
            flex: 1 1 auto !important;
            min-height: calc(100vh - 80px) !important;
            max-height: none !important;
            /* 侧栏脚本隐藏后若仍为双列网格，工作区只占右列会变窄，PDF 内中文挤压、重影似乱码 */
            grid-template-columns: minmax(0, 1fr) !important;
        }
        body.pdf-exporting #main-layout > aside {
            display: none !important;
        }
        body.pdf-exporting #workspace-scroll {
            display: flex !important;
            flex-direction: column !important;
            align-items: stretch !important;
            /* 由步骤内容撑开总高度，避免固定 min-height 导致截图高度计量误差、重叠或裁切 */
            min-height: auto !important;
        }
        /* 导出时展开纵向滚动区，保证 html2canvas 收到完整 scrollHeight，避免表格/热力/举措显示不全 */
        body.pdf-exporting .overflow-y-auto {
            overflow-y: visible !important;
            max-height: none !important;
        }
        body.pdf-exporting .overflow-auto {
            overflow: visible !important;
            max-height: none !important;
        }
        /* 甘特等横向滚动区域展开，避免右侧轨被裁掉 */
        body.pdf-exporting .overflow-x-auto {
            overflow-x: visible !important;
        }
        body.pdf-exporting {
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
        }
        /* 桌面网格下 workspace 仍有 max-height:100%，导出时必须放开否则长步骤被压扁导致截图错位、裁切 */
        body.pdf-exporting #main-layout > #workspace {
            max-height: none !important;
            min-height: 0 !important;
            align-self: stretch !important;
        }
        body.pdf-exporting .step-wrapper {
            animation: none !important;
            opacity: 1 !important;
            transform: none !important;
        }
        body.pdf-exporting .step-wrapper.active {
            flex: 0 0 auto !important;
            min-height: auto !important;
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            overflow: visible !important;
            box-sizing: border-box !important;
            -webkit-font-smoothing: antialiased !important;
        }
        body.pdf-exporting .ui-table-wrap,
        body.pdf-exporting .ui-table-wrap table {
            overflow: visible !important;
        }
        /* PDF 截图时解除 flex 收缩，避免画布高度塌成一条 */
        body.pdf-exporting .bmc-nine {
            flex: none !important;
            min-height: 420px;
        }
        body.pdf-exporting .bmc-nine-main {
            min-height: 260px;
        }
        body.pdf-exporting .roadmap-gantt-scroll {
            min-height: 480px;
            max-height: none !important;
            overflow: visible !important;
        }
        /* 桌面端：整体纵向 flex，主区占满顶栏以下剩余高度，避免 calc 与 zoom 导致与顶栏叠层 */
        @media (min-width: 1024px) {
            body.app-shell {
                display: flex;
                flex-direction: column;
                height: 100dvh;
                max-height: 100dvh;
                overflow: hidden;
            }
            body.app-shell > header {
                flex-shrink: 0;
            }
            body.app-shell > #main-layout {
                flex: 1 1 0;
                min-height: 0;
                max-height: none;
                height: auto;
                /* 单行两列时行高随视口约束；避免侧栏内容最小高度把整行撑出视口导致底部导出按钮被裁切 */
                grid-template-rows: minmax(0, 1fr);
            }
        }
        /* 主区：侧栏叠在工作区卡片之上，减轻右侧阴影盖住侧栏控件 */
        #main-layout {
            isolation: isolate;
        }
        #sidebar {
            position: relative;
            z-index: 3;
        }
        #workspace {
            position: relative;
            z-index: 2;
        }
        /* 主区网格：桌面侧栏宽可动画收缩；子项 min-height:0 否则中间区域无法内部滚动 */
        @media (min-width: 1024px) {
            #main-layout {
                grid-template-columns: minmax(0, var(--sidebar-expanded)) minmax(0, 1fr);
                transition: grid-template-columns 0.22s ease;
            }
            #main-layout > aside,
            #main-layout > #workspace {
                min-height: 0;
                align-self: stretch;
                max-height: 100%;
            }
            #sidebar {
                overflow: hidden;
            }
            #sidebar-workflow-stack {
                min-height: 0;
            }
            #nav-list {
                flex: 1 1 0%;
                min-height: 0;
            }
            #footer-nav {
                padding-top: 0.375rem;
                padding-bottom: 0.375rem;
            }
            #footer-nav button {
                padding-top: 0.375rem;
                padding-bottom: 0.375rem;
            }
            #main-layout.sidebar-collapsed {
                grid-template-columns: minmax(0, 3.5rem) minmax(0, 1fr);
            }
            #sidebar.sidebar-collapsed {
                overflow: hidden;
            }
            /* 桌面端收起/展开在工作区内，与步骤标题并排，不再使用侧栏内 fixed 按钮 */
            #sidebar.sidebar-collapsed .sidebar-expand-only {
                display: none !important;
            }
            #sidebar.sidebar-collapsed #nav-list button {
                justify-content: center;
                padding-left: 0.35rem;
                padding-right: 0.35rem;
                gap: 0;
            }
            #sidebar.sidebar-collapsed #nav-list .nav-step-title {
                display: none !important;
            }
            #sidebar.sidebar-collapsed #nav-config-btn {
                justify-content: center;
                padding-left: 0.35rem;
                padding-right: 0.35rem;
            }
            #sidebar.sidebar-collapsed #nav-config-btn .nav-config-label {
                display: none !important;
            }
            #sidebar.sidebar-collapsed #sidebar-history-panel {
                padding: 0.5rem;
            }
            #sidebar.sidebar-collapsed #sidebar-assets-btn {
                justify-content: center;
                padding-left: 0.35rem;
                padding-right: 0.35rem;
                gap: 0;
            }
        }
        /* 小屏：折叠工作流整块；顶栏 sticky 时工具条留在可视区顶部稍下，避免被遮挡 */
        @media (max-width: 1023px) {
            #sidebar.mobile-nav-collapsed #sidebar-workflow-stack {
                display: none;
            }
            #sidebar-toolbar {
                position: sticky;
                top: var(--header-offset);
                z-index: 45;
                padding-top: 2px;
                padding-bottom: 4px;
                margin-bottom: 2px;
                background: #f5f5f7;
                border-radius: 10px;
            }
        }
    </style>
</head>

    <script>
        // ========== 方法论说明（与当前 7 步主流程 + 数字化资产配置交互一致；步骤标题见 STEPS） ==========
        const METHODOLOGY = {
            s1: {
                bullets: [

        function legacyGapLabelToScore(s) {
            const t = String(s ?? '').trim();
            if (t === '缺失') return 0;
            if (t === '弱') return 2;
            if (t === '中') return 3;
            if (t === '强') return 5;
            return null;
        }

        function normalizeGapDim(v, fallback) {
            const fb = typeof fallback === 'number' && !isNaN(fallback)
                ? Math.max(GAP_SCORE_MIN, Math.min(GAP_SCORE_MAX, Math.round(fallback)))
                : 3;
            if (v == null || v === '') return fb;
            const lab = legacyGapLabelToScore(v);
            if (lab !== null) return lab;
            const s = String(v).trim();
            const low = s.toLowerCase();
            if (low === 'missing' || low === 'none') return 0;
            if (low === 'weak' || low === 'low') return 2;
            if (low === 'medium' || low === 'mid') return 3;
            if (low === 'strong' || low === 'high') return 5;
            const n = parseFloat(s.replace(/,/g, '.'));
            if (!isNaN(n)) return Math.max(GAP_SCORE_MIN, Math.min(GAP_SCORE_MAX, Math.round(n)));
            return fb;

        /** 主流程 7 步（左侧序号与右侧步骤编号一致）；数字化资产配置不在此数组 */

        const METHOD_KEY_TO_STEP = { s1: 1, s2: 2, s3: 3, s4: 4, s5: 5, s6: 6, s7: 7 };

        function getStepMeta(stepId) {
            return STEPS.find(s => s.id === stepId);
        }

        function templateAppliesToIndustry(tpl, industry) {
            if (!tpl || !industry) return true;
            const arr = tpl.industries;
            if (!Array.isArray(arr) || !arr.length) return true;
            return arr.includes(industry);
        }

        function getTemplateIdsForWorkflowIndustry(industry) {
            return Object.keys(currentState.templates).filter(k => templateAppliesToIndustry(currentState.templates[k], industry));
        }

        function ensureSelectedTemplateForIndustry() {
            let ids = getTemplateIdsForWorkflowIndustry(currentState.workflowIndustry);
            if (!ids.length) ids = Object.keys(currentState.templates);
            if (!ids.length) return;
            if (!ids.includes(currentState.selectedTemplateId)) {
                currentState.selectedTemplateId = ids[0];
            }
        }

        function setWorkflowIndustry(val) {
            if (!WORKFLOW_INDUSTRIES.includes(val)) return;
            currentState.workflowIndustry = val;
            ensureSelectedTemplateForIndustry();
            renderStep1();
            if (currentState.step === 2 && currentState.activePanel === 'workflow') renderStep2();
        }

        /** 适用行业：逗号/分号分隔，仅保留 WORKFLOW_INDUSTRIES 中的词 */
        function parseIndustryTagsFromConfigCell(cell) {
            const s = String(cell ?? '').trim();
            if (!s || s === '—' || s === '-' || /^全部$/i.test(s) || /^all$/i.test(s)) return [];
            return s.split(/[,，;；、]/).map(x => x.trim()).filter(x => WORKFLOW_INDUSTRIES.includes(x));
        }

        function templateIndustryBadgeLabel(tpl) {
            if (!tpl || !Array.isArray(tpl.industries) || !tpl.industries.length) return '全部行业';
            return tpl.industries.join('、');
        }

        /** 保存模板时读取适用行业勾选：全不选表示不限行业 */
        function collectTemplateIndustriesFromForm() {
            const arr = [];
            WORKFLOW_INDUSTRIES.forEach((ind, i) => {
                const el = document.getElementById('tpl-industry-' + i);
                if (el && el.checked) arr.push(ind);
            });
            return arr;
        }

        function renderTemplateIndustryCheckboxesHtml() {
            const tpl = currentState.editingTemplateKey ? currentState.templates[currentState.editingTemplateKey] : null;
            const sel = tpl && Array.isArray(tpl.industries) ? tpl.industries : [];
            const hasRestrict = sel.length > 0;
            return `<div class="mb-4 rounded-[12px] border border-black/[0.08] bg-canvas/80 px-3 py-3 space-y-2">
                <p class="text-[12px] font-semibold text-ink">适用行业（与步骤 1 所选行业联动）</p>
                <p class="text-[11px] text-ink-secondary leading-snug">不勾选任何项 → 步骤 2 中<strong class="text-ink font-medium">全部</strong>行业下拉可见该模板；勾选则<strong class="text-ink font-medium">仅</strong>所选行业可见。</p>
                <div class="flex flex-wrap gap-x-4 gap-y-2">${WORKFLOW_INDUSTRIES.map((ind, i) => {
                const checked = hasRestrict && sel.includes(ind);
                return `<label class="inline-flex items-center gap-2 text-[13px] text-ink cursor-pointer select-none">
                    <input type="checkbox" id="tpl-industry-${i}" class="rounded border-black/[0.2] text-accent focus:ring-accent/30" ${checked ? 'checked' : ''} />
                    <span>${ind}</span>
                </label>`;
            }).join('')}</div>
            </div>`;
        }

        function stepLabel(stepId) {

            return s ? `步骤 ${stepId}/${STEP_TOTAL} · ${s.title}` : '';

            const s = getStepMeta(stepId);
            if (!s) return '';

                <h2 class="text-[17px] sm:text-[18px] lg:text-[17px] font-semibold text-ink tracking-tight leading-tight">${s.title}</h2>

        function renderStepProgress() {
            const el = document.getElementById('step-progress');
            if (!el) return;
            if (currentState.activePanel === 'config') {
                el.innerHTML = '';
                el.setAttribute('aria-hidden', 'true');
                return;
            }
            el.removeAttribute('aria-hidden');
            el.innerHTML = STEPS.map(s => {
                let dotCls = 'progress-dot block';
                if (s.id < currentState.step) dotCls += ' done';
                if (s.id === currentState.step) dotCls += ' current';
                return `<button type="button" onclick="setStep(${s.id})" class="shrink-0 p-1.5 lg:p-1 -m-1.5 lg:-m-1 rounded-full border-0 bg-transparent cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2" title="步骤 ${s.id}/${STEP_TOTAL} · ${s.title}" aria-label="转到步骤 ${s.id}/${STEP_TOTAL}"><span class="${dotCls}" aria-hidden="true"></span></button>`;
            }).join('');
        }

        let vsMetrics = {
            lt: 0, vt: 0, pce: '0', healthE2e: 0, worstStageName: '—', worstPct: null,
            fmtAvgEff: '—', fmtAvgQual: '—', fmtAvgCost: '—', fmtAvgRisk: '—', fmtAvgCx: '—'
        };

        function defaultVsStageExtra() {
            const dimActive = {};
            const dimKpiRows = {};
            VS_DIM_KEYS.forEach(k => {
                dimActive[k] = true;
                dimKpiRows[k] = [];
            });
            return {
                valDesc: '',
                dimActive,
                dimKpiRows,
                dEff: 3, dQual: 3, dCost: 3, dRisk: 3, dCx: 3,
                freq: 'mid',
                compliance: 'normal',
                autoPot: 3
            };
        }

        function ensureDimKpiRowsShape(s) {
            if (!s.dimKpiRows || typeof s.dimKpiRows !== 'object') {
                s.dimKpiRows = {};
                VS_DIM_KEYS.forEach(k => { s.dimKpiRows[k] = []; });
            }
            VS_DIM_KEYS.forEach(k => {
                if (!Array.isArray(s.dimKpiRows[k])) s.dimKpiRows[k] = [];
                s.dimKpiRows[k].forEach((row, i) => {
                    if (!row || typeof row !== 'object') return;
                    if (row.id == null || row.id === '') row.id = Date.now() + i;
                    if (row.name == null) row.name = '';
                    if (row.current == null) row.current = '';
                    if (row.target == null) row.target = '';
                });
            });
        }

        function ensureVsStageShape(s) {
            if (!s || typeof s !== 'object') return;
            const ex = defaultVsStageExtra();
            if (s.valDesc === undefined || s.valDesc === null) s.valDesc = '';
            if (!s.dimActive || typeof s.dimActive !== 'object') s.dimActive = { ...ex.dimActive };
            VS_DIM_KEYS.forEach(k => {
                if (typeof s.dimActive[k] !== 'boolean') s.dimActive[k] = true;
            });
            if (!VS_DIM_KEYS.some(k => s.dimActive[k])) s.dimActive.dEff = true;
            ensureDimKpiRowsShape(s);
            VS_DIM_KEYS.forEach(k => {
                let n = parseInt(s[k], 10);
                if (isNaN(n)) n = ex[k];
                s[k] = Math.max(1, Math.min(5, n));
            });
            let ap = parseInt(s.autoPot, 10);
            if (isNaN(ap)) ap = ex.autoPot;
            s.autoPot = Math.max(1, Math.min(5, ap));
            if (!['high', 'mid', 'low'].includes(s.freq)) s.freq = 'mid';
            if (!['low', 'normal', 'high'].includes(s.compliance)) s.compliance = 'normal';
        }

        function syncVsSelectedStage() {
            const arr = currentState.vsStages || [];
            if (!arr.length) {
                currentState.vsSelectedStageId = null;
                return;
            }
            const sid = currentState.vsSelectedStageId;
            if (sid == null || !arr.some(st => st.id === sid)) {
                currentState.vsSelectedStageId = arr[0].id;
            }
        }

        function selectVsStage(id) {
            if (!currentState.vsStages.some(s => s.id === id)) return;
            currentState.vsSelectedStageId = id;

        function normalizeVsDimWeightsInPlace() {
            const w = currentState.vsDimWeights;

                currentState.vsDimWeights = { ...VS_DIM_WEIGHT_DEFAULTS };
                return;
            }
            let sum = VS_DIM_KEYS.reduce((a, k) => a + (parseFloat(w[k]) || 0), 0);
            if (sum <= 0) {
                VS_DIM_KEYS.forEach(k => { w[k] = VS_DIM_WEIGHT_DEFAULTS[k]; });
                return;
            }
            VS_DIM_KEYS.forEach(k => { w[k] = (parseFloat(w[k]) || 0) / sum; });
        }

            VS_DIM_KEYS.forEach(k => {
                if (currentState.vsDimWeights[k] == null || isNaN(parseFloat(currentState.vsDimWeights[k]))) {
                    currentState.vsDimWeights[k] = VS_DIM_WEIGHT_DEFAULTS[k];

            let sum = 0;

            VS_DIM_KEYS.forEach(k => {
                if (!s.dimActive || !s.dimActive[k]) return;
                sum += parseInt(s[k], 10) || 3;
                n++;
            });
            if (!n) return null;
            return Math.round((sum / n / 5) * 1000) / 10;
        }

        function vsStageWeakestDim(s) {
            let minK = null;

            VS_DIM_KEYS.forEach(k => {
                if (!s.dimActive || !s.dimActive[k]) return;
                const sc = parseInt(s[k], 10) || 3;
                if (sc < minSc) {
                    minSc = sc;
                    minK = k;
                }
            });
            if (!minK) return null;
            return { key: minK, score: minSc, label: VS_DIM_LABELS[minK] };
        }

        function resolveAiChatCompletionsUrl(endpoint) {
            let base = String(endpoint || '').trim().replace(/\/+$/, '');
            if (!base) throw new Error('未配置 API 地址');
            if (/\/chat\/completions$/i.test(base)) return base;
            const low = base.toLowerCase();
            if (low.includes('api.deepseek.com')) {

        async function callOpenAiCompatibleChat(systemText, userText) {
            const cfg = loadAiConfig();
            if (!cfg.endpoint) throw new Error('未配置 API 地址');
            const url = resolveAiChatCompletionsUrl(cfg.endpoint);
            const model = cfg.model || 'gpt-4o-mini';
            const body = {
                model,
                messages: [
                    { role: 'system', content: systemText },
                    { role: 'user', content: userText }
                ],
                temperature: 0.45
            };
            const ml = String(model).toLowerCase();
            if (ml.startsWith('deepseek')) {
                if (ml.includes('reasoner')) {
                    body.thinking = { type: 'enabled' };
                    body.reasoning_effort = 'high';
                } else {
                    body.thinking = { type: 'disabled' };
                }
            }
            const res = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...(cfg.apiKey ? { Authorization: 'Bearer ' + cfg.apiKey } : {})
                },
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                const t = await res.text();
                throw new Error(t.slice(0, 200) || res.statusText);
            }
            const data = await res.json();
            const msg = data.choices && data.choices[0] && data.choices[0].message;

            const reason = msg && msg.reasoning_content != null ? String(msg.reasoning_content).trim() : '';
            if (!txt && reason) txt = reason;
            else if (reason) txt = txt + '\n\n——\n【推理过程】\n' + reason;
            return txt || '（模型返回为空）';

        function buildAiWorkflowPatchSystemSuffix() {
            return `\n\n【结构化回填】在给出中文解读后，必须追加一个 Markdown 代码块（语言标记为 json），内含唯一对象，格式示例：
\`\`\`json
{"workflowPatch":{"version":1,"bmc":{},"valueStreamName":"","stages":[],"capabilities":[],"capabilityGaps":[],"initiatives":[],"roadmap":{}}}
\`\`\`
约定（仅输出用户明确要求写入、或你确信应写入的字段；未涉及的键请省略或留空数组，不要编造业务细节）：\n` +
                `· workflowPatch.bmc：键仅限英文 ${FIELD_ORDER.join(', ')}，值为字符串，与九宫格对应。\n` +
                `· workflowPatch.valueStreamName：价值流名称（可选）。\n` +
                `· workflowPatch.stages：价值流阶段数组；每项含 name、type(process|wait)、scenarios、components（逗号分隔组件）、actualTime（小时数，数字），可选 dEff,dQual,dCost,dRisk,dCx（1-5）。提供 stages 时会替换当前价值流阶段列表（与左侧手工/模板互斥于数据层，用户仍可再改）。\n` +
                `· workflowPatch.capabilities：业务能力清单；非空则整体替换当前清单。每项含 l3，可选 l1,l2,desc,linkedVs,curMat,tgtMat(1-5),gapOrg,gapProc,gapData,gapIt（四维成熟度各为 0～5 整数，越高越成熟；亦可沿用英文 weak/medium/strong 或旧版缺失/弱/中/强）,sys,tech,ice。\n` +
                `· workflowPatch.capabilityGaps：仅按 l3 匹配更新四维差距；每项含 l3 及 gapOrg/gapProc/gapData/gapIt 中需要改的字段（同上，0～5）。\n` +
                `· workflowPatch.initiatives：变革举措；非空则整体替换。每项含 title，可选 caps(数组),gaps,window,benefit,cost（难易程度文案）,phase(P0|P1|P2),tech,deps,milestoneBand，streams 为子路标数组（start 为从 0 起的月索引，len 为持续月数）。\n` +
                `· workflowPatch.roadmap：可选 startYm(YYYY-MM)、months(6-48)。\n` +
                `当前用户步骤若与补丁无关，仍可给出补丁以便其切换步骤后已有数据；但不要无故清空未提及的模块。`;
        }

        function extractWorkflowPatchFromText(text) {
            if (!text || typeof text !== 'string') return null;
            const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
            const tryObj = (raw) => {
                try {
                    const o = JSON.parse(raw);
                    if (o && typeof o.workflowPatch === 'object' && o.workflowPatch !== null) return o.workflowPatch;
                } catch (e) { /* ignore */ }
                return null;
            };
            if (fence) {
                const wp = tryObj(fence[1].trim());
                if (wp) return wp;
            }
            const keyIdx = text.indexOf('"workflowPatch"');
            if (keyIdx !== -1) {
                const colon = text.indexOf(':', keyIdx);
                const open = colon !== -1 ? text.indexOf('{', colon) : -1;
                if (open !== -1) {
                    let depth = 0;
                    for (let i = open; i < text.length; i++) {
                        const ch = text[i];
                        if (ch === '{') depth++;
                        else if (ch === '}') {
                            depth--;
                            if (depth === 0) {
                                const inner = text.slice(open, i + 1);
                                const wp = tryObj('{"workflowPatch":' + inner + '}');
                                if (wp) return wp;
                                break;
                            }
                        }
                    }
                }
            }
            return null;
        }

        function applyStagesFromAiPatch(stages, valueStreamName) {
            if (!Array.isArray(stages) || !stages.length) return;
            if (valueStreamName != null && valueStreamName !== '') {
                currentState.valueStreamName = String(valueStreamName).trim();
            }
            currentState.vsStages = stages.map((s, idx) => {
                const t = s.type === 'wait' ? 'wait' : 'process';
                const at = parseInt(s.actualTime != null ? s.actualTime : s.defaultTime, 10);
                const row = {
                    id: idx + 1,
                    name: String(s.name || `阶段 ${idx + 1}`).trim(),
                    type: t,
                    defaultTime: !isNaN(at) && at > 0 ? at : 1,
                    actualTime: !isNaN(at) && at > 0 ? at : 1,
                    scenarios: String(s.scenarios || ''),
                    components: String(s.components || ''),
                    ...defaultVsStageExtra()
                };
                VS_DIM_KEYS.forEach(k => {
                    if (s[k] != null && s[k] !== '') {
                        const n = parseInt(s[k], 10);
                        if (!isNaN(n)) row[k] = Math.max(1, Math.min(5, n));
                    }
                });
                return row;
            });
            currentState.vsStages.forEach(ensureVsStageShape);
            syncVsSelectedStage();
            calcVSMetrics();
        }

        function applyCapabilitiesFromAiPatch(rows) {
            if (!Array.isArray(rows) || !rows.length) return;
            currentState.capabilityFramework = rows.map((raw, idx) => {
                const l3 = String(raw.l3 || '').trim() || `能力块 ${idx + 1}`;
                const def = CAPABILITY_DB[l3] || CAPABILITY_DB.default;
                const inferred = inferL1L2FromComponent(l3);
                const l1 = String(raw.l1 != null && String(raw.l1).trim() ? raw.l1 : inferred.l1).trim();
                const l2 = String(raw.l2 != null && String(raw.l2).trim() ? raw.l2 : inferred.l2).trim();
                const curMat = Math.max(1, Math.min(5, parseInt(raw.curMat, 10) || Math.round((def.mat.o + def.mat.p + def.mat.d + def.mat.i) / 4)));
                const tgtMat = Math.max(1, Math.min(5, parseInt(raw.tgtMat, 10) || Math.min(5, curMat + 2)));
                const gapOrg = normalizeGapDim(raw.gapOrg, gapFromMat(def.mat.o));
                const gapProc = normalizeGapDim(raw.gapProc, gapFromMat(def.mat.p));
                const gapData = normalizeGapDim(raw.gapData, gapFromMat(def.mat.d));
                const gapIt = normalizeGapDim(raw.gapIt, gapFromMat(def.mat.i));
                let ice = raw.ice != null && String(raw.ice).trim() !== '' ? String(raw.ice) : (def.pri.v * 0.4 + def.pri.u * 0.4 + def.pri.f * 0.2).toFixed(1);
                return {
                    id: idx + 1,
                    l1,
                    l2,
                    l3,
                    desc: String(raw.desc != null ? raw.desc : '').trim() || `支撑价值流：${String(raw.linkedVs || '').trim() || l3}`,
                    linkedVs: String(raw.linkedVs != null ? raw.linkedVs : '').trim(),
                    curMat,
                    tgtMat,
                    gapOrg,
                    gapProc,
                    gapData,
                    gapIt,
                    sys: String(raw.sys != null && String(raw.sys).trim() ? raw.sys : def.sys),
                    tech: String(raw.tech != null && String(raw.tech).trim() ? raw.tech : def.tech),
                    ice
                };
            });
            currentState.capabilityFramework.sort((a, b) => parseFloat(b.ice) - parseFloat(a.ice));
        }

        function mergeCapabilityGapsFromAiPatch(updates) {
            if (!Array.isArray(updates)) return;
            updates.forEach(u => {
                const q = String(u.l3 || u.matchL3 || '').trim();
                if (!q) return;
                const c = currentState.capabilityFramework.find(x => x.l3 === q)
                    || currentState.capabilityFramework.find(x => (x.l3 && (x.l3.includes(q) || q.includes(x.l3))));
                if (!c) return;
                const def = CAPABILITY_DB[c.l3] || CAPABILITY_DB.default;
                const mk = { gapOrg: 'o', gapProc: 'p', gapData: 'd', gapIt: 'i' };
                ['gapOrg', 'gapProc', 'gapData', 'gapIt'].forEach(k => {
                    if (u[k] != null && u[k] !== '') {
                        const prev = normalizeGapDim(c[k], gapFromMat(def.mat[mk[k]]));
                        c[k] = normalizeGapDim(u[k], prev);
                    }
                });
            });
        }

        /** @returns {{ ok: boolean, summary?: string }} */
        function applyWorkflowPatchObject(wp) {

                touched.bmc = true;
                parts.push('商业画布');

            if (wp.valueStreamName != null && String(wp.valueStreamName).trim() !== '' && (!wp.stages || !wp.stages.length)) {
                currentState.valueStreamName = String(wp.valueStreamName).trim();
                touched.vs = true;
                parts.push('价值流名称');
            }
            if (wp.stages && wp.stages.length) {
                applyStagesFromAiPatch(wp.stages, wp.valueStreamName);
                touched.vs = true;
                parts.push('价值流阶段');
            }
            if (wp.capabilities && wp.capabilities.length) {
                applyCapabilitiesFromAiPatch(wp.capabilities);
                touched.cap = true;
                parts.push('能力架构');
            }
            if (wp.capabilityGaps && wp.capabilityGaps.length) {
                mergeCapabilityGapsFromAiPatch(wp.capabilityGaps);
                touched.cap = true;
                parts.push('差距四维');

                applyInitiativesFromAiPatch(wp.initiatives);
                touched.ini = true;
                parts.push('变革举措');
            }
            const did = touched.bmc || touched.vs || touched.cap || touched.ini || touched.roadmap;
            if (did) refreshUiAfterWorkflowPatch(touched);
            return { ok: did, summary: parts.join('、') };
        }

        /** AI 助手抽屉：按住标题区拖动，避免遮挡工作台（保留右下角默认定位直至首次拖动） */
        function bindAiDrawerDrag() {
            const drawer = document.getElementById('ai-assistant-drawer');
            const handle = document.getElementById('ai-drawer-drag-handle');
            if (!drawer || !handle || handle.dataset.dragBound === '1') return;
            handle.dataset.dragBound = '1';

            let dragging = false;
            let startX = 0;
            let startY = 0;
            let startLeft = 0;
            let startTop = 0;

            function ensureLeftTopFromCurrentRect() {
                if (drawer.style.left && drawer.style.top) return;
                const r = drawer.getBoundingClientRect();
                drawer.style.right = 'auto';
                drawer.style.bottom = 'auto';
                drawer.style.left = `${Math.round(r.left)}px`;
                drawer.style.top = `${Math.round(r.top)}px`;
            }

            function startDrag(clientX, clientY) {
                dragging = true;
                ensureLeftTopFromCurrentRect();
                const rect = drawer.getBoundingClientRect();
                startLeft = rect.left;
                startTop = rect.top;
                startX = clientX;
                startY = clientY;
                handle.classList.add('ai-drawer-dragging');
            }

            function moveDrag(clientX, clientY) {
                if (!dragging) return;
                const dx = clientX - startX;
                const dy = clientY - startY;
                let nl = startLeft + dx;
                let nt = startTop + dy;
                const w = drawer.offsetWidth;
                const h = drawer.offsetHeight;
                const pad = 8;
                const vw = document.documentElement.clientWidth;
                const vh = document.documentElement.clientHeight;
                nl = Math.max(pad, Math.min(nl, vw - w - pad));
                nt = Math.max(pad, Math.min(nt, vh - h - pad));
                drawer.style.left = `${Math.round(nl)}px`;
                drawer.style.top = `${Math.round(nt)}px`;
            }

            function endDrag() {
                if (!dragging) return;
                dragging = false;
                handle.classList.remove('ai-drawer-dragging');
            }

            handle.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                startDrag(e.clientX, e.clientY);
                e.preventDefault();
            });
            window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
            window.addEventListener('mouseup', endDrag);

            handle.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;
                const t = e.touches[0];
                startDrag(t.clientX, t.clientY);
            }, { passive: true });
            window.addEventListener('touchmove', (e) => {

        const BLUEPRINT_HISTORY_LS = 'archipro-blueprint-history-v1';

        function loadBlueprintHistoryList() {

                return [];

        }

        function getSerializableWorkflowSnapshot() {
            const snap = {};
            WORKFLOW_SNAPSHOT_KEYS.forEach(k => {
                snap[k] = JSON.parse(JSON.stringify(currentState[k] !== undefined ? currentState[k] : null));
            });
            return snap;
        }

        function migrateCapabilityFrameworkGapScores() {
            const fw = currentState.capabilityFramework || [];
            fw.forEach(c => {
                const def = CAPABILITY_DB[c.l3] || CAPABILITY_DB.default;
                c.gapOrg = normalizeGapDim(c.gapOrg, gapFromMat(def.mat.o));
                c.gapProc = normalizeGapDim(c.gapProc, gapFromMat(def.mat.p));
                c.gapData = normalizeGapDim(c.gapData, gapFromMat(def.mat.d));
                c.gapIt = normalizeGapDim(c.gapIt, gapFromMat(def.mat.i));
            });
        }

        function applyWorkflowSnapshot(raw) {
            const s = raw && typeof raw === 'object' ? raw : {};
            WORKFLOW_SNAPSHOT_KEYS.forEach(k => {
                if (s[k] === undefined) return;
                currentState[k] = JSON.parse(JSON.stringify(s[k]));
            });
            migrateCapabilityFrameworkGapScores();
            if (!currentState.workflowIndustry || !WORKFLOW_INDUSTRIES.includes(currentState.workflowIndustry)) {
                currentState.workflowIndustry = '3C';
            }
            ensureSelectedTemplateForIndustry();
            calcVSMetrics();
        }

            try {

                return d.toLocaleString('zh-CN', { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return String(iso || '');
            }
        }

        function sanitizePdfFilenameBase(title) {
            return String(title || '规划版本').replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, '_').slice(0, 72);

            const url = `${base}#assets`;

        /** 从快照提取资产列表行所需的 7 步核心摘要 */
        function summarizeSnapshotForAssetsRow(snap) {
            if (!snap || typeof snap !== 'object') snap = {};
            const bmc = snap.bmc || {};
            const vp = String(bmc.valuePropositions || '').replace(/\s+/g, ' ').trim();
            const cust = String(bmc.customerSegments || '').replace(/\s+/g, ' ').trim();
            const s1 = vp ? vp.slice(0, 56) + (vp.length > 56 ? '…' : '') : (cust ? `细分：${cust.slice(0, 40)}` : '—');
            const vsName = String(snap.valueStreamName || '—').trim();
            const stages = snap.vsStages || [];
            const s2 = stages.length ? `${vsName} · ${stages.length} 阶段` : `${vsName} · 未生成阶段`;
            const cf = snap.capabilityFramework || [];
            let r = 0, y = 0, g = 0;
            cf.forEach(c => {
                const cat = heatCategory(c);
                if (cat === 'red') r++;
                else if (cat === 'yellow') y++;
                else g++;
            });
            const s3 = cf.length ? `${cf.length} 项能力块` : '—';
            const weakDims = cf.filter(c => {
                const def = CAPABILITY_DB[c.l3] || CAPABILITY_DB.default;
                const o = normalizeGapDim(c.gapOrg, gapFromMat(def.mat.o));
                const p = normalizeGapDim(c.gapProc, gapFromMat(def.mat.p));
                return o <= 2 || p <= 2;
            }).length;
            const s4 = cf.length ? `四维差距已填 · ${weakDims} 项偏弱维` : '—';
            const s5 = cf.length ? `红 ${r} / 黄 ${y} / 绿 ${g}` : '—';
            const ini = snap.initiatives || [];
            const ph = { P0: 0, P1: 0, P2: 0 };
            ini.forEach(i => {
                if (ph[i.phase] != null) ph[i.phase]++;
            });
            const s6 = ini.length ? `${ini.length} 条 · P0 ${ph.P0} / P1 ${ph.P1} / P2 ${ph.P2}` : '—';
            const rs = snap.roadmapStartYm || '';
            const rm = snap.roadmapMonths;
            const s7 = rs && rm ? `${rs} 起 · ${rm} 个月` : '—';
            return { s1, s2, s3, s4, s5, s6, s7, s1full: vp || cust || '—' };
        }

        /** 步骤 7 底部「保存」：写入历史记录（不影响当前编辑会话） */
        function saveBlueprintHistory() {
            if (currentState.step !== STEP_TOTAL || currentState.activePanel !== 'workflow') return;
            if (!currentState.initiatives.length) {
                toast('请先完成前面的步骤并生成举措与路标数据后再保存', 'error');
                return;
            }
            const defaultTitle = `${currentState.valueStreamName || '数智化转型规划'} · ${new Date().toLocaleString('zh-CN', { hour12: false })}`;
            const input = window.prompt('为该保存版本命名（留空则使用默认名称）', defaultTitle);
            if (input === null) return;
            const title = (input || '').trim() || defaultTitle;
            const record = {
                id: Date.now(),
                savedAt: new Date().toISOString(),
                title,
                snapshot: getSerializableWorkflowSnapshot()
            };
            const list = loadBlueprintHistoryList();
            list.unshift(record);
            saveBlueprintHistoryList(list);
            toast('已保存。可在侧栏「资产」打开资产库查看与管理');
            renderSidebarHistoryPanel();
        }

        /** 主工作台调用：按 id 载入资产快照 */
        function applyAssetRecordById(id) {
            const rec = loadBlueprintHistoryList().find(r => r.id === Number(id));
            if (!rec || !rec.snapshot) {
                toast('记录不存在或已失效', 'error');
                return false;
            }
            applyWorkflowSnapshot(rec.snapshot);
            currentState.activePanel = 'workflow';
            currentState.step = STEP_TOTAL;
            renderNav();
            renderStepProgress();
            renderStep();
            toast('已从资产库载入，可在各步骤继续修改');
            return true;
        }

        function deleteHistoryRecord(id) {
            if (!window.confirm('确定删除这条历史版本吗？')) return;
            const list = loadBlueprintHistoryList().filter(r => r.id !== id);
            saveBlueprintHistoryList(list);
            renderSidebarHistoryPanel();
            if (isAssetsStandaloneMode()) renderAssetsStandaloneContent();
            toast('已删除该版本');
        }

        /** 根据历史快照生成 PDF（完成后恢复当前编辑状态） */
        async function exportPdfFromHistoryRecord(recordId) {
            const rec = loadBlueprintHistoryList().find(r => r.id === recordId);
            if (!rec || !rec.snapshot) {
                toast('记录不存在', 'error');
                return;
            }
            const backupSnap = getSerializableWorkflowSnapshot();
            const backupStep = currentState.step;
            const backupPanel = currentState.activePanel;
            try {
                applyWorkflowSnapshot(rec.snapshot);
                currentState.activePanel = 'workflow';
                currentState.step = STEP_TOTAL;
                renderNav();
                renderStepProgress();
                const fname = `BA_${sanitizePdfFilenameBase(rec.title)}_${String(rec.id).slice(-8)}.pdf`;
                await runPdfExportCore(fname);
            } finally {
                applyWorkflowSnapshot(backupSnap);
                currentState.step = backupStep;
                currentState.activePanel = backupPanel;
                renderNav();
                renderStepProgress();
                renderStep();
                renderSidebarHistoryPanel();
            }
        }

        /** 商业画布：Excel 模板导出 / 导入（SheetJS） */
        function bmcFieldNameToKey() {
            return Object.fromEntries(Object.entries(FIELD_MAP).map(([k, v]) => [String(v).trim(), k]));
        }

        function pickBmcImportSheet(wb) {
            const names = wb.SheetNames || [];
            const byName = names.find(n => n === '商业画布' || /^商业画布/.test(n));
            if (byName) return wb.Sheets[byName];
            const skip = new Set(['使用说明', 'README', '说明']);
            const other = names.find(n => !skip.has(n));
            return wb.Sheets[other || names[0]];
        }

        function exportBmcExcel() {
            if (typeof XLSX === 'undefined') {
                toast('未加载表格库，请检查网络后重试', 'error');
                return;
            }
            const stamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, '');
            const wb = XLSX.utils.book_new();
            const head = ['字段键（勿改，导入据此匹配）', '字段名称', '填写内容'];
            const data = [head, ...FIELD_ORDER.map(k => [k, FIELD_MAP[k], (currentState.bmc[k] != null ? String(currentState.bmc[k]) : '')])];
            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [{ wch: 32 }, { wch: 16 }, { wch: 64 }];
            XLSX.utils.book_append_sheet(wb, ws, '商业画布');
            const readme = [
                ['使用说明'],
                ['1. 在「填写内容」列维护文字；不要改「字段键」列，否则无法自动对应到页面九宫格。'],
                ['2. 若只保留「字段名称 + 填写内容」两列，导入时按中文名称匹配（须与第二列原名称一致）。'],
                ['3. 导出会带上当前页面已填写内容，可在 Excel 中改完再「导入 Excel」一次覆盖到页面。']
            ];
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(readme), '使用说明');
            XLSX.writeFile(wb, `商业画布蓝图_${stamp}.xlsx`);
            toast('已下载 Excel，可在表内编辑后使用导入');
        }

        function importBmcExcel(ev) {
            const input = ev.target;
            const file = input.files && input.files[0];
            input.value = '';
            if (!file) return;
            if (typeof XLSX === 'undefined') {
                toast('未加载表格库，请检查网络后重试', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const buf = new Uint8Array(e.target.result);
                    const wb = XLSX.read(buf, { type: 'array' });
                    const ws = pickBmcImportSheet(wb);
                    if (!ws) {
                        toast('未找到可导入的工作表', 'error');
                        return;
                    }
                    const matrix = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
                    const nameToKey = bmcFieldNameToKey();
                    let updated = 0;
                    for (let i = 0; i < matrix.length; i++) {
                        const row = matrix[i];
                        if (!row || row.length === 0) continue;
                        const c0 = String(row[0] != null ? row[0] : '').trim();
                        const c1 = String(row[1] != null ? row[1] : '').trim();
                        const c2 = row[2] != null ? String(row[2]) : '';
                        if (i === 0 && (c0.includes('字段键') || c1.includes('字段名称') || c0 === '字段键' || c1 === '字段名称')) continue;
                        let key = null;
                        let text = '';
                        if (FIELD_ORDER.includes(c0)) {
                            key = c0;
                            text = c2 !== '' ? c2 : c1;
                        } else if (nameToKey[c0] && (row.length < 3 || c2 === '')) {
                            key = nameToKey[c0];
                            text = c1;
                        } else if (nameToKey[c1]) {
                            key = nameToKey[c1];
                            text = c2;
                        }
                        if (key) {
                            currentState.bmc[key] = text;
                            updated++;
                        }
                    }
                    if (updated === 0) {
                        toast('未识别到有效行：请确认首列为字段键或第二列为标准字段名称', 'error');
                        return;
                    }
                    currentState.bmcReport = null;
                    renderStep1();
                    toast(`已导入 ${updated} 个画布字段`);
                } catch (err) {
                    console.error(err);
                    toast('导入失败：请使用本页导出的 xlsx 或核对列结构', 'error');
                }
            };
            reader.onerror = () => toast('读取文件失败', 'error');
            reader.readAsArrayBuffer(file);
        }

        /** 画布字段：Excel 单元格可为英文键或中文名 */
        function normalizeBmcFieldKeyFromCell(val) {
            const s = String(val ?? '').trim();
            if (!s) return '';
            if (FIELD_ORDER.includes(s)) return s;
            const hit = Object.entries(FIELD_MAP).find(([, zh]) => zh === s);
            return hit ? hit[0] : '';
        }

        function pickConfigWorksheet(wb, candidates) {
            const names = wb.SheetNames || [];
            for (const c of candidates) {
                const hit = names.find(n => n === c || String(n).replace(/\s/g, '') === String(c).replace(/\s/g, ''));
                if (hit) return wb.Sheets[hit];
            }
            return null;
        }

        function parseRulesFromConfigMatrix(matrix) {
            const rules = [];
            let baseId = Date.now();
            for (let i = 0; i < matrix.length; i++) {
                const row = matrix[i];
                if (!row || row.length === 0) continue;
                const c0 = String(row[0] ?? '').trim();
                const c1 = String(row[1] ?? '').trim();
                if (i === 0 && (c0.includes('field') || c0.includes('字段') || c0.includes('键'))) continue;
                let field = normalizeBmcFieldKeyFromCell(c0);
                if (!field && c1) field = normalizeBmcFieldKeyFromCell(c1);
                const keyword = String(row[2] ?? '').trim();
                let compareFieldRaw = String(row[3] ?? '').trim();
                const compareZh = String(row[4] ?? '').trim();
                const compareKeyword = String(row[5] ?? '').trim();
                const scoreRaw = row[6];
                const message = String(row[7] ?? '').trim();
                if (!field || !keyword || !message) continue;
                let compareField = compareFieldRaw;
                if (!compareField || compareField === '无' || compareField === '-' || /^none$/i.test(compareField)) {
                    compareField = 'none';
                } else {
                    compareField = normalizeBmcFieldKeyFromCell(compareField) || normalizeBmcFieldKeyFromCell(compareZh) || 'none';
                }
                if (compareField !== 'none' && !compareKeyword) compareField = 'none';
                const score = parseInt(scoreRaw, 10);
                rules.push({
                    id: baseId++,
                    field,
                    keyword,
                    compareField,
                    compareKeyword: compareField === 'none' ? '' : compareKeyword,
                    message,
                    score: isNaN(score) ? 10 : Math.max(0, Math.min(100, score))
                });
            }
            return rules;
        }

        function parseTemplatesFromConfigMatrix(matrix) {
            const header = matrix[0] || [];
            const industryColRecognized = header.length > 8 && (/适用|行业/.test(String(header[8] ?? '')) || String(header[8] ?? '').trim().length > 0);
            const groups = new Map();
            let currentKey = null;
            for (let i = 0; i < matrix.length; i++) {
                const row = matrix[i];
                if (!row || row.length === 0) continue;
                const keyCell = String(row[0] ?? '').trim();
                const nameCell = String(row[1] ?? '').trim();
                const stageName = String(row[3] ?? '').trim();
                const typeRaw = String(row[4] ?? '').trim().toLowerCase();
                const defaultTime = parseInt(row[5], 10);
                const scenarios = String(row[6] ?? '');
                const components = String(row[7] ?? '');
                const industryCell = row.length > 8 ? row[8] : '';
                if (i === 0 && (keyCell.includes('模板键') || keyCell.includes('模板'))) continue;
                if (keyCell) {
                    currentKey = keyCell;
                    if (!groups.has(currentKey)) {
                        groups.set(currentKey, { name: nameCell || currentKey, stages: [], industrySet: new Set() });
                    } else if (nameCell) {
                        groups.get(currentKey).name = nameCell;
                    }
                }
                if (!currentKey || !stageName) continue;
                if (!groups.has(currentKey)) {
                    groups.set(currentKey, { name: nameCell || currentKey, stages: [], industrySet: new Set() });
                }
                const g = groups.get(currentKey);
                if (nameCell) g.name = nameCell;
                parseIndustryTagsFromConfigCell(industryCell).forEach(x => g.industrySet.add(x));
                const type = typeRaw === 'wait' ? 'wait' : 'process';
                const dt = isNaN(defaultTime) ? 1 : Math.max(0, defaultTime);
                g.stages.push({
                    id: g.stages.length + 1,
                    name: stageName,
                    type,
                    defaultTime: dt,
                    scenarios: scenarios.trim(),
                    components: components.trim()
                });
            }
            const out = {};
            groups.forEach((v, k) => {
                if (!v.stages.length) return;
                v.stages.forEach((s, idx) => { s.id = idx + 1; });
                const inds = [...v.industrySet];
                out[k] = { name: v.name || k, stages: v.stages };
                if (inds.length) out[k].industries = inds;
            });
            return { parsed: out, mergePreserveIndustry: !industryColRecognized };
        }

        function pickCapabilityFrameworkSheet(wb) {
            const names = wb.SheetNames || [];
            const candidates = ['业务能力架构', '能力架构', '业务能力清单'];
            for (const c of candidates) {
                const hit = names.find(n => n === c || String(n).replace(/\s/g, '') === c.replace(/\s/g, ''));
                if (hit) return wb.Sheets[hit];
            }
            const skip = new Set(['使用说明', 'README', '说明']);
            const other = names.find(n => !skip.has(n));
            return other ? wb.Sheets[other] : null;
        }

        function parseCapabilityFrameworkFromMatrix(matrix) {
            const out = [];
            for (let i = 0; i < matrix.length; i++) {
                const row = matrix[i];
                if (!row || row.length === 0) continue;
                const c0 = String(row[0] ?? '').trim();
                if (i === 0 && (c0.includes('价值流') || c0.includes('业务能力') || c0.includes('L3'))) continue;
                const l3 = String(row[1] ?? '').trim();
                if (!l3) continue;
                const linkedVs = String(row[0] ?? '').trim();
                const desc = row[2] != null ? String(row[2]) : '';
                const l1 = String(row[3] ?? '').trim();
                const l2 = String(row[4] ?? '').trim();
                let curMat = parseInt(row[5], 10);
                let tgtMat = parseInt(row[6], 10);
                if (isNaN(curMat)) curMat = 3;
                if (isNaN(tgtMat)) tgtMat = Math.min(5, curMat + 2);
                curMat = Math.max(1, Math.min(5, curMat));
                tgtMat = Math.max(1, Math.min(5, tgtMat));
                const def = CAPABILITY_DB[l3] || CAPABILITY_DB.default;
                const hasGapCols = row.length >= 12;
                const gapOrg = normalizeGapDim(hasGapCols ? row[8] : '', gapFromMat(def.mat.o));
                const gapProc = normalizeGapDim(hasGapCols ? row[9] : '', gapFromMat(def.mat.p));
                const gapData = normalizeGapDim(hasGapCols ? row[10] : '', gapFromMat(def.mat.d));
                const gapIt = normalizeGapDim(hasGapCols ? row[11] : '', gapFromMat(def.mat.i));
                let iceStr = '';
                const iceRaw = row[7];
                if (iceRaw != null && String(iceRaw).trim() !== '') {
                    const x = parseFloat(iceRaw);
                    iceStr = isNaN(x) ? (def.pri.v * 0.4 + def.pri.u * 0.4 + def.pri.f * 0.2).toFixed(1) : parseFloat(x).toFixed(1);
                } else {
                    iceStr = (def.pri.v * 0.4 + def.pri.u * 0.4 + def.pri.f * 0.2).toFixed(1);
                }
                const sys = row.length >= 13 && String(row[12] ?? '').trim() ? String(row[12]).trim() : def.sys;
                const tech = row.length >= 14 && String(row[13] ?? '').trim() ? String(row[13]).trim() : def.tech;
                out.push({
                    linkedVs,
                    l3,
                    desc,
                    l1,
                    l2,
                    curMat,
                    tgtMat,
                    ice: iceStr,
                    gapOrg,
                    gapProc,
                    gapData,
                    gapIt,
                    sys,
                    tech
                });
            }
            out.sort((a, b) => parseFloat(b.ice) - parseFloat(a.ice));
            return out;
        }

        function runBMCAnalysis() {
            const btn = document.getElementById('btn-analyze');
            if (btn) { btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xs" aria-hidden="true"></i><span class="ml-2">分析中…</span>'; btn.disabled = true; }
            setTimeout(() => {
                let score = 100;
                const risks = [];
                const suggestions = ['基于画布可引入伙伴生态分担非核心成本，优化成本结构。'];
                currentState.rules.forEach(r => {
                    const val = currentState.bmc[r.field] || '';
                    if (!val.includes(r.keyword)) return;
                    let hit = r.compareField === 'none' || !r.compareField;
                    if (!hit) {
                        const comp = currentState.bmc[r.compareField] || '';
                        hit = comp.includes(r.compareKeyword);
                    }
                    if (hit) { score -= r.score; risks.push(r.message); }
                });
                if (!risks.length) suggestions.push('未发现规则库中的显著结构性冲突（可结合定性评审）。');
                currentState.bmcReport = { score: Math.max(0, score), risks, suggestions };
                if (btn) { btn.innerHTML = '<i class="fas fa-wand-magic-sparkles text-xs opacity-90" aria-hidden="true"></i><span class="ml-2">运行诊断</span>'; btn.disabled = false; }
                renderStep1();
                toast('诊断完成');
            }, 700);
        }

        function calcVSMetrics() {
            ensureAllVsStagesShape();
            const stages = currentState.vsStages;
            const lt = stages.reduce((a, s) => a + (parseInt(s.actualTime, 10) || 0), 0);
            const vt = stages.filter(s => s.type === 'process').reduce((a, s) => a + (parseInt(s.actualTime, 10) || 0), 0);
            const pce = lt > 0 ? ((vt / lt) * 100).toFixed(1) : '0';
            const healthList = [];
            let worstStage = null;
            let worstPct = 101;
            stages.forEach(s => {
                const hp = computeStageHealthPct(s);
                if (hp != null) {
                    healthList.push(hp);
                    if (hp < worstPct) {
                        worstPct = hp;
                        worstStage = s;
                    }
                }
            });
            const healthE2e = healthList.length ? Math.round((healthList.reduce((a, b) => a + b, 0) / healthList.length) * 10) / 10 : 0;
            const fmtAvg = (v) => (v == null ? '—' : `${v}/5`);
            const aE = avgDimAcrossStages('dEff');
            const aQ = avgDimAcrossStages('dQual');
            const aC = avgDimAcrossStages('dCost');
            const aR = avgDimAcrossStages('dRisk');
            const aX = avgDimAcrossStages('dCx');
            vsMetrics = {
                lt,
                vt,
                pce,
                healthE2e,
                worstStageName: worstStage ? worstStage.name : '—',
                worstPct: worstStage ? worstPct : null,
                avgEff: aE,
                avgQual: aQ,
                avgCost: aC,
                avgRisk: aR,
                avgCx: aX,
                fmtAvgEff: fmtAvg(aE),
                fmtAvgQual: fmtAvg(aQ),
                fmtAvgCost: fmtAvg(aC),
                fmtAvgRisk: fmtAvg(aR),
                fmtAvgCx: fmtAvg(aX)
            };
        }

        function runVSGen() {
            const tpl = currentState.templates[currentState.selectedTemplateId];
            if (!tpl || !tpl.stages.length) {
                toast('模板无效', 'error');
                return;
            }
            currentState.vsStages = tpl.stages.map((s, idx) => {
                const base = { ...defaultVsStageExtra(), ...s };
                return {
                    ...base,
                    id: idx + 1,

                    scenarios: s.scenarios || '',
                    components: s.components || '',
                    valDesc: s.valDesc || ''
                };
            });
            currentState.vsStages.forEach(ensureVsStageShape);
            currentState.vsSelectedStageId = currentState.vsStages[0] ? currentState.vsStages[0].id : null;
            calcVSMetrics();
            renderStep2();
            toast('已套用模板：点击①中卡片切换②编辑该阶段指标');
        }

        function nextVSStageId() {
            const ids = currentState.vsStages.map(s => s.id);
            return (ids.length ? Math.max(...ids) : 0) + 1;
        }

                id: 1,

        function removeVSStage(id) {

                toast('至少保留一个价值流阶段', 'error');
                return;
            }
            if (!window.confirm('确定删除该阶段？流程简图将同步更新。')) return;
