        function moveVSStage(id, delta) {
            const arr = currentState.vsStages;
            const i = arr.findIndex(s => s.id === id);
            if (i < 0) return;
            const j = i + delta;
            if (j < 0 || j >= arr.length) return;
            const t = arr[i];
            arr[i] = arr[j];
            arr[j] = t;
            renderStep2();
        }

        function updateVSStage(id, field, value) {
            const s = currentState.vsStages.find(x => x.id === id);
            if (!s) return;
            if (field === 'actualTime') s.actualTime = parseInt(value, 10) || 0;
            else if (field === 'type') s.type = value === 'wait' ? 'wait' : 'process';
            else if (field === 'name') s.name = value;
            else if (VS_DIM_KEYS.includes(field)) s[field] = Math.max(1, Math.min(5, parseInt(value, 10) || 3));
            else if (field === 'autoPot') s.autoPot = Math.max(1, Math.min(5, parseInt(value, 10) || 3));
            else if (field === 'freq') s.freq = ['high', 'mid', 'low'].includes(value) ? value : 'mid';
            else if (field === 'compliance') s.compliance = ['low', 'normal', 'high'].includes(value) ? value : 'normal';
            else if (field === 'valDesc') s.valDesc = value;
            else s[field] = value;
            calcVSMetrics();
            renderStep2();
        }

        /** @param {{ silent?: boolean }} [opts] silent：由「价值流」页点下一步时自动生成，不单独刷新当前页、不弹 Toast */
        function runFrameworkGen(opts) {
            const silent = !!(opts && opts.silent);
            if (!currentState.vsStages.length) {
                if (!silent) toast(`请先在「${stepLabel(2)}」生成价值流`, 'error');
                return false;
            }
            const blocks = [];
            currentState.vsStages.forEach(st => {
                const parts = (st.components || '').split(/[,，]/).map(x => x.trim()).filter(Boolean);
                parts.forEach(p => blocks.push({ name: p, stage: st.name }));
            });
            const seen = new Set();
            currentState.capabilityFramework = [];
            let idx = 0;
            blocks.forEach(b => {
                if (seen.has(b.name)) return;
                seen.add(b.name);
                const def = CAPABILITY_DB[b.name] || CAPABILITY_DB.default;
                const { l1, l2 } = inferL1L2FromComponent(b.name);
                const cur = Math.round((def.mat.o + def.mat.p + def.mat.d + def.mat.i) / 4);
                const tgt = Math.min(5, cur + 2);
                const ice = (def.pri.v * 0.4 + def.pri.u * 0.4 + def.pri.f * 0.2).toFixed(1);
                idx += 1;
                currentState.capabilityFramework.push({
                    id: idx,
                    l1, l2, l3: b.name,
                    desc: `支撑价值流阶段「${b.stage}」的业务组件`,
                    linkedVs: `${currentState.valueStreamName || '价值流'} → ${b.stage}`,
                    curMat: cur, tgtMat: tgt,
                    gapOrg: gapFromMat(def.mat.o),
                    gapProc: gapFromMat(def.mat.p),
                    gapData: gapFromMat(def.mat.d),
                    gapIt: gapFromMat(def.mat.i),
                    sys: def.sys, tech: def.tech, ice
                });
            });
            currentState.capabilityFramework.sort((a, b) => parseFloat(b.ice) - parseFloat(a.ice));
            if (!silent) {
                renderStep3();
                toast('业务能力架构已生成');
            }
            return true;
        }

        /** 由内嵌组件成熟度(1–5)推断四维默认差距分（与旧版 缺失/弱/中/强 刻度对齐） */
        function gapFromMat(m) {
            const x = parseInt(m, 10);
            if (isNaN(x)) return 2;
            if (x <= 2) return 0;
            if (x === 3) return 2;
            if (x === 4) return 3;
            return 5;
        }

        function heatCategory(block) {
            const def = CAPABILITY_DB[block.l3] || CAPABILITY_DB.default;
            const gaps = [
                normalizeGapDim(block.gapOrg, gapFromMat(def.mat.o)),
                normalizeGapDim(block.gapProc, gapFromMat(def.mat.p)),
                normalizeGapDim(block.gapData, gapFromMat(def.mat.d)),
                normalizeGapDim(block.gapIt, gapFromMat(def.mat.i))
            ];
            const le2 = gaps.filter(g => g <= 2).length;
            if (gaps.some(g => g === 0) || le2 >= 2) return 'red';
            if (le2 === 1) return 'yellow';
            return 'green';
        }

        /** 步骤 4 表格：四维算术平均分（展示用，与热力着色同一套归一规则） */
        function gapFourDimAvgRow(c) {
            const def = CAPABILITY_DB[c.l3] || CAPABILITY_DB.default;
            const vals = [
                normalizeGapDim(c.gapOrg, gapFromMat(def.mat.o)),
                normalizeGapDim(c.gapProc, gapFromMat(def.mat.p)),
                normalizeGapDim(c.gapData, gapFromMat(def.mat.d)),
                normalizeGapDim(c.gapIt, gapFromMat(def.mat.i))
            ];
            return Math.round((vals.reduce((a, b) => a + b, 0) / 4) * 10) / 10;
        }

        /** 统计一组能力块的红/黄/绿数量 */
        function countHeatStats(blocks) {
            let red = 0;
            let yellow = 0;
            let green = 0;
            blocks.forEach(c => {
                const k = heatCategory(c);
                if (k === 'red') red++;
                else if (k === 'yellow') yellow++;
                else green++;
            });
            return { red, yellow, green, total: blocks.length };
        }

        /** 按业务能力架构出现顺序构建 L1 → L2 → 能力块列表 */
        function buildHeatmapL1L2Tree(framework) {
            const l1Order = [];
            const tree = {};
            framework.forEach(c => {
                const l1 = (c.l1 && String(c.l1).trim()) || '未分类';
                const l2 = (c.l2 && String(c.l2).trim()) || '未分类';
                if (tree[l1] === undefined) {
                    tree[l1] = { l2Order: [], byL2: {}, seenL2: {} };
                    l1Order.push(l1);
                }
                const node = tree[l1];
                if (!node.seenL2[l2]) {
                    node.seenL2[l2] = true;
                    node.l2Order.push(l2);
                    node.byL2[l2] = [];
                }
                node.byL2[l2].push(c);
            });
            return { l1Order, tree };
        }

        /** 全局 + 按 L1 + 按 L2 的热力分布汇总 */
        function heatmapDistributionSummary(framework) {
            const { l1Order, tree } = buildHeatmapL1L2Tree(framework);
            const overall = countHeatStats(framework);
            const byL1 = l1Order.map(l1 => {
                const node = tree[l1];
                const blocks = node.l2Order.flatMap(l2 => node.byL2[l2]);
                return { l1, ...countHeatStats(blocks) };
            });
            const byL2 = [];
            l1Order.forEach(l1 => {
                const node = tree[l1];
                node.l2Order.forEach(l2 => {
                    const blocks = node.byL2[l2];
                    byL2.push({ l1, l2, ...countHeatStats(blocks) });
                });
            });
            return { overall, byL1, byL2 };
        }

        function heatmapCapabilityCardHtml(c) {
            const cat = heatCategory(c);
            const cls = cat === 'red' ? 'heat-red' : cat === 'yellow' ? 'heat-yellow' : 'heat-green';
            const badge = cat === 'red' ? '优先处理' : cat === 'yellow' ? '纳入计划' : '相对健康';
            const def = CAPABILITY_DB[c.l3] || CAPABILITY_DB.default;
            const go = normalizeGapDim(c.gapOrg, gapFromMat(def.mat.o));
            const gp = normalizeGapDim(c.gapProc, gapFromMat(def.mat.p));
            const gd = normalizeGapDim(c.gapData, gapFromMat(def.mat.d));
            const gi = normalizeGapDim(c.gapIt, gapFromMat(def.mat.i));
            const avg = gapFourDimAvgRow(c);
            return `<button type="button" onclick="setStep(4)" class="rounded-[14px] border-2 p-3 lg:p-3 text-left transition hover:shadow-card min-h-[7rem] lg:min-h-0 flex flex-col ${cls} focus:outline-none focus-visible:ring-2 focus-visible:ring-accent">
                            <p class="text-[15px] lg:text-[16px] font-semibold text-ink leading-snug">${escapeHtmlText(c.l3)}</p>
                            <p class="text-[11px] lg:text-[12px] text-ink-secondary mt-2 leading-relaxed flex-1">组织 ${go} · 流程 ${gp} · 数据 ${gd} · IT ${gi} · 均分 ${avg}</p>
                            <p class="mt-2 lg:mt-3 inline-flex text-[11px] font-semibold px-2 py-1 rounded-full shrink-0 ${cat === 'red' ? 'bg-[#ff6961]/15 text-[#b91c1c]' : cat === 'yellow' ? 'bg-amber-100/80 text-amber-900' : 'bg-emerald-100/80 text-emerald-900'}">${badge}</p>
                        </button>`;
        }

        function escapeHtmlText(s) {
            return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
        }

        function sortInitiativesByPhase(arr) {
            const rank = { P0: 0, P1: 1, P2: 2 };
            return [...arr].sort((a, b) => (rank[a.phase] ?? 9) - (rank[b.phase] ?? 9) || (a.id ?? 0) - (b.id ?? 0));
        }

        function ensureRoadmapTimelineDefaults() {
            if (!currentState.roadmapStartYm || !/^\d{4}-\d{2}$/.test(currentState.roadmapStartYm)) {
                const d = new Date();
                currentState.roadmapStartYm = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            }
            let n = parseInt(currentState.roadmapMonths, 10);
            if (isNaN(n)) n = 24;
            currentState.roadmapMonths = Math.max(6, Math.min(48, n));
            if (!currentState.roadmapExpandedIniIds || typeof currentState.roadmapExpandedIniIds !== 'object') {
                currentState.roadmapExpandedIniIds = {};
            }
        }

        function getRoadmapHorizon() {
            ensureRoadmapTimelineDefaults();
            return currentState.roadmapMonths;
        }

        function clampRoadmapSeg(start, len, horizon) {
            const H = horizon ?? getRoadmapHorizon();
            const s = Math.max(0, Math.min(start | 0, H - 1));
            const l = Math.max(1, Math.min(len | 0, H - s));
            return { start: s, len: l };
        }

        /** 甘特起始月/跨度变更后刷新路标页（时间轴仅在步骤 7 配置） */
        function afterRoadmapTimelineChange() {
            syncItFeaturesFromInitiatives();
            if (currentState.step === 7) renderStep7();
        }

        function setRoadmapStartYm(ym) {
            if (!ym || !/^\d{4}-\d{2}$/.test(ym)) {
                toast('请选择有效起始月份', 'error');
                return;
            }
            currentState.roadmapStartYm = ym;
            afterRoadmapTimelineChange();
        }

        /** 月份选择器部分浏览器仅 blur 才提交，保留 change + blur 双绑 */
        function applyRoadmapStartFromEl(el) {
            if (el && el.value) setRoadmapStartYm(el.value);
        }

        function setRoadmapMonthsFromUi(val) {
            const n = parseInt(val, 10);
            if (isNaN(n)) return;
            currentState.roadmapMonths = Math.max(6, Math.min(48, n));
            currentState.initiatives.forEach(ini => {
                if (!ini.streams?.length) return;
                ini.streams = ini.streams.map(st => {
                    const seg = clampRoadmapSeg(st.start, st.len, currentState.roadmapMonths);
                    return { ...st, start: seg.start, len: seg.len };
                });
            });
            afterRoadmapTimelineChange();
            toast(`时间轴长度：${currentState.roadmapMonths} 个月`);
        }

        /** 举措汇总条包围盒（0-based 起点、终点不含） */
        function initiativeStreamEnvelope(streams, H) {
            if (!streams?.length) return { minS: 0, maxE: Math.min(6, H), span: Math.min(6, H) };
            let minS = H;
            let maxE = 0;
            streams.forEach(st => {
                minS = Math.min(minS, st.start);
                maxE = Math.max(maxE, st.start + st.len);
            });
            const span = Math.max(1, maxE - minS);
            return { minS, maxE, span };
        }

        /** 按新的「整体起点 + 跨度」比例缩放平移各子路标（保持相对形状） */
        function updateInitiativeGanttEnvelope(iniId, startFrom1Raw, spanMonthsRaw) {
            ensureRoadmapTimelineDefaults();
            const ini = currentState.initiatives.find(x => x.id === iniId);
            if (!ini?.streams?.length) return;
            const H = getRoadmapHorizon();
            let newStart0 = parseInt(startFrom1Raw, 10);
            if (isNaN(newStart0)) return;
            newStart0 = Math.max(1, Math.min(H, newStart0)) - 1;
            let newSpan = parseInt(spanMonthsRaw, 10);
            if (isNaN(newSpan)) newSpan = 1;
            newSpan = Math.max(1, Math.min(H - newStart0, newSpan));

            const { minS, maxE } = initiativeStreamEnvelope(ini.streams, H);
            const oldLen = Math.max(1, maxE - minS);

            ini.streams = ini.streams.map(st => {
                const normStart = (st.start - minS) / oldLen;
                const normLen = st.len / oldLen;
                let s = Math.round(newStart0 + normStart * newSpan);
                let l = Math.max(1, Math.round(normLen * newSpan));
                const seg = clampRoadmapSeg(s, l, H);
                return { ...st, start: seg.start, len: seg.len };
            });
            syncItFeaturesFromInitiatives();
            renderStep7();
        }

        function updateInitiativeGanttEnvelopeFromRow(iniId, el) {
            const row = el.closest('[data-ini-env]');
            if (!row) return;
            const startEl = row.querySelector('[data-env-start]');
            const spanEl = row.querySelector('[data-env-span]');
            if (!startEl || !spanEl) return;
            updateInitiativeGanttEnvelope(iniId, startEl.value, spanEl.value);
        }

        function toggleRoadmapIniExpanded(id) {
            ensureRoadmapTimelineDefaults();
            const key = String(id);
            currentState.roadmapExpandedIniIds[key] = !currentState.roadmapExpandedIniIds[key];
            renderStep7();
        }

        function updateInitiativeStreamField(iniId, streamIdx, field, raw) {
            ensureRoadmapTimelineDefaults();
            const ini = currentState.initiatives.find(x => x.id === iniId);
            if (!ini?.streams?.[streamIdx]) return;
            const H = getRoadmapHorizon();
            const st = ini.streams[streamIdx];
            if (field === 'label') {
                st.label = raw;
                syncItFeaturesFromInitiatives();
                renderStep7();
                return;
            }
            if (field === 'start') {
                let n = parseInt(raw, 10);
                if (isNaN(n)) n = 0;
                n = Math.max(0, Math.min(H - 1, n));
                const seg = clampRoadmapSeg(n, st.len, H);
                st.start = seg.start;
                st.len = seg.len;
            }
            if (field === 'len') {
                let n = parseInt(raw, 10);
                if (isNaN(n)) n = 1;
                const seg = clampRoadmapSeg(st.start, n, H);
                st.start = seg.start;
                st.len = seg.len;
            }
            syncItFeaturesFromInitiatives();
            renderStep7();
        }

        function updateStreamStartMonthFromOne(iniId, si, monthFrom1) {
            const H = getRoadmapHorizon();
            let m = parseInt(monthFrom1, 10);
            if (isNaN(m)) m = 1;
            m = Math.max(1, Math.min(H, m));
            updateInitiativeStreamField(iniId, si, 'start', String(m - 1));
        }

        function updateStreamLenMonths(iniId, si, lenVal) {
            updateInitiativeStreamField(iniId, si, 'len', String(parseInt(lenVal, 10) || 1));
        }

        function initiativePhaseChipClass(p) {
            if (p === 'P0') return 'bg-[#ff6961]/14 text-[#b91c1c] ring-1 ring-[#ff6961]/22';
            if (p === 'P1') return 'bg-accent-muted text-accent ring-1 ring-accent/22';
            return 'bg-emerald-100/85 text-emerald-900 ring-1 ring-emerald-800/12';
        }

        /** 补齐举措上路标所需字段（优先级、技术方案、依赖、里程碑带、甘特子轨）；skipStreams：仅维护元数据，不自动生成子路标（步骤 6 列表用） */
        function ensureInitiativeRoadmapFields(ini, sortedIdx, forceStreams = false, skipStreams = false) {
            ensureRoadmapTimelineDefaults();
            const H = getRoadmapHorizon();
            const cap = currentState.capabilityFramework.find(c => ini.caps && ini.caps.includes(c.l3));
            if (!ini.phase) {
                ini.phase = sortedIdx === 0 ? 'P0' : sortedIdx <= 2 ? 'P1' : 'P2';
            }
            if (ini.tech == null || ini.tech === '') {
                ini.tech = cap ? `${cap.tech} · API 集成与中台落地` : '微服务与中台能力沉淀 · 可演进架构';
            }
            if (ini.deps == null || ini.deps === '') {
                ini.deps = sortedIdx === 0
                    ? '可与企业数据盘点、范围澄清并行；无强制前置版本冻结'
                    : '依赖：前置优先级举措关键里程碑、企业架构与安全基线发布';
            }
            if (!ini.milestoneBand) {
                ini.milestoneBand = ini.phase === 'P0' ? '奠基窗口（T0–6 月）' : ini.phase === 'P1' ? '扩展窗口（6–14 月）' : '固化与优化（14–24 月）';
            }
            if (skipStreams) {
                if (ini.streams?.length) {
                    ini.streams = ini.streams.map(st => {
                        const seg = clampRoadmapSeg(st.start, st.len, H);
                        return { label: st.label || '子路标', start: seg.start, len: seg.len };
                    });
                }
                return;
            }
            if (forceStreams || !ini.streams || !ini.streams.length) {
                const base = Math.min(sortedIdx * 2, Math.max(0, H - 8));
                ini.streams = [
                    clampRoadmapSeg(base, 2, H),
                    clampRoadmapSeg(base + 1, 3, H),
                    clampRoadmapSeg(base + 3, 5, H),
                    clampRoadmapSeg(base + 7, 3, H)
                ].map((seg, i) => ({
                    ...seg,
                    label: ['规划与Charter立项', '方案设计及评审', '开发交付与测试', '试点推行与验收'][i]
                }));
            } else {
                ini.streams = ini.streams.map(st => {
                    const seg = clampRoadmapSeg(st.start, st.len, H);
                    return { label: st.label || '子路标', start: seg.start, len: seg.len };
                });
            }
        }

        function syncItFeaturesFromInitiatives() {
            currentState.itFeatures = sortInitiativesByPhase(currentState.initiatives).map(ini => ({
                id: ini.id,
                name: `${ini.title} — 路标包`,
                iniId: ini.id,
                phase: ini.phase,
                tech: ini.tech,
                deps: ini.deps,
                milestone: ini.milestoneBand || ''
            }));
        }

        function updateInitiativeField(id, field, value) {
            const ini = currentState.initiatives.find(x => x.id === id);
            if (ini) ini[field] = value;
        }

        function updateInitiativePhase(id, phase) {
            const p = ['P0', 'P1', 'P2'].includes(phase) ? phase : 'P2';
            const ini = currentState.initiatives.find(x => x.id === id);
            if (!ini || ini.phase === p) return;
            ini.phase = p;
            syncItFeaturesFromInitiatives();
            renderStep6();
            if (currentState.step === 7) renderStep7();
        }

        function removeInitiative(id) {
            if (!window.confirm('确定删除该变革举措？「变革路标计划」中对应行将同步移除。')) return;
            currentState.initiatives = currentState.initiatives.filter(x => x.id !== id);
            try {
                delete currentState.roadmapExpandedIniIds[String(id)];
            } catch (e) { /* ignore */ }
            syncItFeaturesFromInitiatives();
            renderStep6();
            if (currentState.step === 7) renderStep7();
            toast('已删除该举措');
        }

        function buildRoadmapMonthLabels() {
            ensureRoadmapTimelineDefaults();
            const H = getRoadmapHorizon();
            const parts = currentState.roadmapStartYm.split('-');
            const ys = parseInt(parts[0], 10);
            const ms = parseInt(parts[1], 10);
            const months = [];
            for (let i = 0; i < H; i++) {
                const d = new Date(ys, ms - 1 + i, 1);
                months.push({
                    i,
                    y: d.getFullYear(),
                    m: d.getMonth() + 1,
                    q: Math.ceil((d.getMonth() + 1) / 3)
                });
            }
            return months;
        }

        function roadmapBarStyle(start, len, horizon) {
            const H = horizon ?? getRoadmapHorizon();
            const { start: s, len: l } = clampRoadmapSeg(start, len, H);
            const left = (s / H) * 100;
            const width = (l / H) * 100;
            return `left:${left}%;width:${Math.max(width, 100 / H * 0.85)}%;`;
        }

        function roadmapEndYmReadable() {
            ensureRoadmapTimelineDefaults();
            const months = buildRoadmapMonthLabels();
            const last = months[months.length - 1];
            return last ? `${last.y}年${last.m}月` : '—';
        }

        /** 路标页（或内嵌甘特）共用：起始月 + 跨度（uid 区分 DOM id） */
        function buildRoadmapTimelineToolbarHtml(uid) {
            ensureRoadmapTimelineDefaults();
            const H = getRoadmapHorizon();
            const startYm = currentState.roadmapStartYm;
            const endReadable = roadmapEndYmReadable();
            const spanSelectOpts = [12, 18, 24, 30, 36, 48].map(n =>
                `<option value="${n}" ${H === n ? 'selected' : ''}>${n}</option>`).join('');
            return `
                <div class="flex flex-wrap items-center gap-x-3 gap-y-2 print-hidden">
                    <span class="text-[12px] font-semibold text-ink whitespace-nowrap">甘特时间轴</span>
                    <label class="inline-flex items-center gap-1.5">
                        <span class="text-[11px] text-ink-tertiary whitespace-nowrap">起始月</span>
                        <input type="month" id="roadmap-${uid}-start" value="${startYm}"
                            onchange="applyRoadmapStartFromEl(this)" onblur="applyRoadmapStartFromEl(this)"
                            class="rounded-[10px] border border-black/[0.10] bg-canvas px-2 py-1.5 text-[13px] font-medium text-ink focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/20 w-[11.5rem]" />
                    </label>
                    <label class="inline-flex items-center gap-1.5">
                        <span class="text-[11px] text-ink-tertiary whitespace-nowrap">长度</span>
                        <select id="roadmap-${uid}-span" onchange="setRoadmapMonthsFromUi(this.value)"
                            class="rounded-[10px] border border-black/[0.10] bg-canvas px-2.5 py-1.5 text-[13px] font-medium text-ink focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/20 tabular-nums">
                            ${spanSelectOpts}
                        </select>
                        <span class="text-[11px] text-ink-secondary">个月</span>
                    </label>
                    <span class="text-[11px] text-ink-secondary">截止到 <span class="font-semibold text-ink tabular-nums">${endReadable}</span></span>
                </div>`;
        }

        function buildRoadmapGanttHtml(opts) {
            const showTimelineToolbar = !opts || opts.timelineToolbar !== false;
            ensureRoadmapTimelineDefaults();
            const H = getRoadmapHorizon();
            const months = buildRoadmapMonthLabels();
            const initiatives = sortInitiativesByPhase(currentState.initiatives);
            initiatives.forEach((ini, idx) => ensureInitiativeRoadmapFields(ini, idx));
            const streamColors = ['bg-accent/88', 'bg-[#5856d6]/82', 'bg-[#34c759]/78', 'bg-amber-500/76'];
            let rows = '';
            initiatives.forEach((ini) => {
                const expanded = !!currentState.roadmapExpandedIniIds[String(ini.id)];
                const streams = ini.streams || [];
                let minS = H;
                let maxE = 0;
                streams.forEach(st => {
                    minS = Math.min(minS, st.start);
                    maxE = Math.max(maxE, st.start + st.len);
                });
                if (!streams.length) {
                    minS = 0;
                    maxE = H;
                }
                const env = initiativeStreamEnvelope(streams, H);
                const sumStyle = roadmapBarStyle(minS, Math.max(1, maxE - minS), H);
                const phaseCls = initiativePhaseChipClass(ini.phase);
                const safeTitle = escapeHtmlText(ini.title);
                const chevron = expanded ? 'fa-chevron-down' : 'fa-chevron-right';
                rows += `
                <div class="flex border-b border-black/[0.07] bg-white">
                    <div class="w-[min(42vw,280px)] shrink-0 sticky left-0 z-[16] flex gap-2 border-r border-black/[0.06] bg-white px-2 py-2.5">
                        <button type="button" onclick="toggleRoadmapIniExpanded(${ini.id})" class="print-hidden mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-[10px] border border-black/[0.08] bg-canvas text-ink-secondary hover:bg-white hover:text-ink transition-colors" aria-expanded="${expanded}" title="${expanded ? '收起子路标' : '展开编辑子路标'}">
                            <i class="fas ${chevron} text-[11px]" aria-hidden="true"></i>
                        </button>
                        <div class="flex min-w-0 flex-1 flex-col justify-center gap-1">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="rounded-md px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide ${phaseCls}">${ini.phase}</span>
                                <span class="text-[13px] font-semibold text-ink leading-snug">${safeTitle}</span>
                            </div>
                            <p class="text-[11px] text-ink-tertiary leading-snug">${escapeHtmlText(ini.milestoneBand || '')}</p>
                            <div data-ini-env class="print-hidden flex flex-wrap items-center gap-x-1 gap-y-0.5 text-[10px] text-ink-secondary mt-0.5">
                                <span class="text-ink font-medium">汇总</span>
                                <span>第</span>
                                <input type="number" min="1" max="${H}" data-env-start title="汇总条起点（横轴第几个月）"
                                    class="w-9 rounded-md border border-black/[0.10] bg-white px-0.5 py-0.5 text-center text-[10px] font-semibold tabular-nums text-ink"
                                    value="${env.minS + 1}" onchange="updateInitiativeGanttEnvelopeFromRow(${ini.id},this)" />
                                <span>月起 ·</span>
                                <input type="number" min="1" max="${H}" data-env-span title="汇总条覆盖月数"
                                    class="w-9 rounded-md border border-black/[0.10] bg-white px-0.5 py-0.5 text-center text-[10px] font-semibold tabular-nums text-ink"
                                    value="${env.span}" onchange="updateInitiativeGanttEnvelopeFromRow(${ini.id},this)" />
                                <span>个月</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex-1 min-w-0 relative roadmap-gantt-track py-3 px-0" style="--rg-months:${H}">
                        <div class="roadmap-gantt-bar bg-black/[0.12] ring-1 ring-black/[0.06]" style="${sumStyle}" title="举措合计跨度"></div>
                    </div>
                </div>`;
                if (expanded) {
                    streams.forEach((st, si) => {
                        const stStyle = roadmapBarStyle(st.start, st.len, H);
                        const labVal = escapeHtmlText(st.label);
                        rows += `
                <div class="flex border-b border-black/[0.04] bg-canvas/40">
                    <div class="w-[min(42vw,280px)] shrink-0 sticky left-0 z-[16] border-r border-black/[0.06] bg-canvas/40 px-3 py-2 pl-3">
                        <div class="space-y-2">
                            <label class="block text-[10px] font-medium text-ink-tertiary">名称</label>
                            <input type="text" class="w-full rounded-[8px] border border-black/[0.10] bg-white px-2 py-1.5 text-[11px] text-ink focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/15" value="${labVal}" onchange="updateInitiativeStreamField(${ini.id},${si},'label',this.value)" />
                            <div class="flex flex-wrap items-center gap-1 text-[10px] text-ink-secondary">
                                <span>第</span>
                                <input type="number" min="1" max="${H}" class="w-10 rounded-md border border-black/[0.10] bg-white px-1 py-1 text-center text-[11px] font-semibold tabular-nums text-ink" value="${st.start + 1}" onchange="updateStreamStartMonthFromOne(${ini.id},${si},this.value)" title="横轴第几个月（相对顶部起始月）" />
                                <span>月起 ·</span>
                                <input type="number" min="1" max="${H}" class="w-10 rounded-md border border-black/[0.10] bg-white px-1 py-1 text-center text-[11px] font-semibold tabular-nums text-ink" value="${st.len}" onchange="updateStreamLenMonths(${ini.id},${si},this.value)" />
                                <span>个月</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex-1 min-w-0 relative roadmap-gantt-track py-2 px-0" style="--rg-months:${H}">
                        <div class="roadmap-gantt-bar sm ${streamColors[si % streamColors.length]}" style="${stStyle}" title="${escapeHtmlText(st.label)} · 列 ${st.start + 1}–${st.start + st.len}"></div>
                    </div>
                </div>`;
                    });
                }
            });
            const headerCells = months.map(mo => {
                const qMark = [1, 4, 7, 10].includes(mo.m) ? `<span class="text-[9px] text-accent font-semibold">Q${mo.q}</span>` : '';
                return `<div class="flex-1 min-w-[26px] border-l border-black/[0.06] px-0.5 py-2 text-center leading-tight bg-canvas/90">
                    ${qMark}<div class="text-[9px] font-semibold text-ink tabular-nums ${mo.m === 1 ? 'text-accent' : ''}">${mo.y}</div>
                    <div class="text-[10px] text-ink-secondary">${mo.m}月</div>
                </div>`;
            }).join('');
            const toolbarBlock = showTimelineToolbar ? `
                <div class="shrink-0 border-b border-black/[0.06] bg-canvas/50 px-3 py-2.5">
                    <div class="flex flex-col gap-2 lg:flex-row lg:flex-wrap lg:items-center lg:justify-between">
                        ${buildRoadmapTimelineToolbarHtml('card')}
                        <button type="button" onclick="refreshRoadmapStreams()" class="print-hidden self-start rounded-[10px] px-2.5 py-1 text-[11px] font-semibold text-accent hover:bg-accent/10 transition-colors" title="按 P0→P1→P2 重新分配各条时间片">
                            按优先级重排条块
                        </button>
                    </div>
                    <p class="text-[11px] text-ink-secondary mt-2 leading-snug">① 先设上面「起始月、长度」② 点 <span class="font-medium text-ink">▸</span> 展开改子任务 ③ 或在每行「汇总」改整体起止（子条按比例伸缩）</p>
                </div>` : '';
            return `
            <div class="flex flex-col flex-1 min-h-0 rounded-[14px] border border-black/[0.08] bg-white shadow-nav overflow-hidden roadmap-gantt-scroll" style="--rg-months:${H}">
                ${toolbarBlock}
                <div class="flex-1 min-h-0 overflow-auto roadmap-gantt-scroll">
                    <div class="min-w-[720px] lg:min-w-[920px]">
                        <div class="flex sticky top-0 z-20 border-b border-black/[0.08] bg-white shadow-[0_1px_0_rgba(0,0,0,0.04)]">
                            <div class="w-[min(42vw,280px)] shrink-0 sticky left-0 z-[21] flex items-end border-r border-black/[0.06] bg-white px-3 py-2">
                                <span class="text-[11px] font-semibold text-ink-tertiary uppercase tracking-wide">举措 / 子路标</span>
                            </div>
                            <div class="flex flex-1">${headerCells}</div>
                        </div>
                        ${rows}
                    </div>
                </div>
            </div>`;
        }

        function refreshRoadmapStreams() {
            if (!currentState.initiatives.length) {
                toast(`请先在「${getStepMeta(6).title}」生成举措`, 'error');
                return;
            }
            const sorted = sortInitiativesByPhase(currentState.initiatives);
            sorted.forEach((ini, idx) => {
                ini.streams = null;
                ensureInitiativeRoadmapFields(ini, idx, true);
            });
            syncItFeaturesFromInitiatives();
            renderStep7();
            toast('已按当前举措优先级重算甘特时间轴');
        }

        /** @param {{ silent?: boolean }} [opts] silent：由「热力图」页点下一步时自动生成 */
        function runInitiativesGen(opts) {
            const silent = !!(opts && opts.silent);
            if (!currentState.capabilityFramework.length) {
                if (!silent) toast(`请先在「${stepLabel(3)}」生成业务能力架构`, 'error');
                return false;
            }
            currentState.initiatives = [];
            currentState.capabilityFramework.forEach((c, i) => {
                const cat = heatCategory(c);
                if (cat === 'green') return;
                const def = CAPABILITY_DB[c.l3] || CAPABILITY_DB.default;
                const gO = normalizeGapDim(c.gapOrg, gapFromMat(def.mat.o));
                const gP = normalizeGapDim(c.gapProc, gapFromMat(def.mat.p));
                const gD = normalizeGapDim(c.gapData, gapFromMat(def.mat.d));
                const gI = normalizeGapDim(c.gapIt, gapFromMat(def.mat.i));
                const gaps = [];
                if (gO < 5) gaps.push('组织');
                if (gP < 5) gaps.push('流程');
                if (gD < 5) gaps.push('数据');
                if (gI < 5) gaps.push('IT');
                currentState.initiatives.push({
                    id: i + 1,
                    title: cat === 'red' ? `攻坚：${c.l3} 能力补齐` : `优化：${c.l3} 能力提升`,
                    caps: [c.l3],
                    gaps,
                    window: cat === 'red' ? '近期（0–6 月）' : '中期（6–18 月）',
                    benefit: '缩短端到端周期，降低手工与返工',
                    cost: cat === 'red' ? '难' : '中'
                });
            });
            if (!currentState.initiatives.length) {
                if (!silent) toast('当前热力图为绿为主，暂无强制变革项（已为您插入一条巩固类举措，可再改）', 'loading');
                currentState.initiatives.push({
                    id: 1,
                    title: '持续优化：数据与自动化巩固',
                    caps: currentState.capabilityFramework.slice(0, 2).map(x => x.l3),
                    gaps: ['数据', 'IT'],
                    window: '长期',
                    benefit: '巩固数字化成效',
                    cost: '易'
                });
            }
            currentState.initiatives.sort((a, b) => {
                const score = (t) => (t.startsWith('攻坚') ? 0 : t.startsWith('优化') ? 1 : 2);
                return score(a.title) - score(b.title) || a.id - b.id;
            });
            currentState.initiatives.forEach((ini, idx) => {
                ini.phase = idx === 0 ? 'P0' : idx <= 2 ? 'P1' : 'P2';
                ini.tech = '';
                ini.deps = '';
                ini.milestoneBand = '';
                ini.streams = null;
                ensureInitiativeRoadmapFields(ini, idx, true);
            });
            syncItFeaturesFromInitiatives();
            if (!silent) {
                renderStep6();
                toast('已生成变革举措草案（含优先级与依赖；甘特与时间轴请在「变革路标计划」配置）');
            }
            return true;
        }

        /** 兼容旧入口：与「刷新甘特」等价 */
        function runITFeaturesGen() {
            refreshRoadmapStreams();
        }

        function updateGap(id, dim, val) {
            const c = currentState.capabilityFramework.find(x => x.id === id);
            if (c) {
                const def = CAPABILITY_DB[c.l3] || CAPABILITY_DB.default;
                const fb = { gapOrg: gapFromMat(def.mat.o), gapProc: gapFromMat(def.mat.p), gapData: gapFromMat(def.mat.d), gapIt: gapFromMat(def.mat.i) };
                c[dim] = normalizeGapDim(val, fb[dim] ?? 3);
                renderStep5();
                renderStep4();
            }
        }

        function updateFrameworkMat(id, field, val) {
            const c = currentState.capabilityFramework.find(x => x.id === id);
            if (!c) return;
            const n = parseInt(val, 10);
            if (field === 'curMat') c.curMat = Math.max(1, Math.min(5, isNaN(n) ? c.curMat : n));
            if (field === 'tgtMat') c.tgtMat = Math.max(1, Math.min(5, isNaN(n) ? c.tgtMat : n));
            renderStep3();
        }

        /** 业务能力架构：可编辑文本字段（价值流阶段、L3、描述、L1、L2） */
        function updateFrameworkField(id, field, val) {
            const c = currentState.capabilityFramework.find(x => x.id === id);
            if (!c || !['l1', 'l2', 'desc', 'l3', 'linkedVs'].includes(field)) return;
            const s = String(val ?? '');
            if (field === 'l1') c.l1 = s.trim();
            else if (field === 'l2') c.l2 = s.trim();
            else if (field === 'desc') c.desc = s;
            else if (field === 'l3') {
                const t = s.trim();
                c.l3 = t || '未命名能力块';
            } else c.linkedVs = s.trim();
            renderStep3();
            renderStep4();
            renderStep5();
        }

        function nextCapabilityFrameworkId() {
            const ids = currentState.capabilityFramework.map(c => c.id);
            return ids.length ? Math.max(...ids) + 1 : 1;
        }

        /** 手工新增一行能力块（默认成熟度/差距来自内置模板，ICE 随模板计算） */
        function addCapabilityFrameworkRow() {
            const def = CAPABILITY_DB.default;
            const cur = Math.round((def.mat.o + def.mat.p + def.mat.d + def.mat.i) / 4);
            const tgt = Math.min(5, cur + 2);
            const ice = (def.pri.v * 0.4 + def.pri.u * 0.4 + def.pri.f * 0.2).toFixed(1);
            currentState.capabilityFramework.push({
                id: nextCapabilityFrameworkId(),
                l1: '',
                l2: '',
                l3: '新能力块',
                desc: '',
                linkedVs: '手工录入',
                curMat: cur,
                tgtMat: tgt,
                gapOrg: gapFromMat(def.mat.o),
                gapProc: gapFromMat(def.mat.p),
                gapData: gapFromMat(def.mat.d),
                gapIt: gapFromMat(def.mat.i),
                sys: def.sys,
                tech: def.tech,
                ice
            });
            renderStep3();
            renderStep4();
            renderStep5();
            toast('已新增能力块，请按需修改各列');
        }

        function removeCapabilityFrameworkRow(id) {
            const n = currentState.capabilityFramework.length;
            if (n <= 1) {
                if (!window.confirm('删除后能力清单为空，后续差距与热力图将暂无数据。确定删除？')) return;
            } else if (!window.confirm('确定删除该能力块？')) {
                return;
            }
            currentState.capabilityFramework = currentState.capabilityFramework.filter(c => c.id !== id);
            renderStep3();
            renderStep4();
            renderStep5();
            toast('已删除该能力块');
        }

        function addRule() {
            const f = document.getElementById('rule-field').value;
            const k = document.getElementById('rule-kw').value;
            const msg = document.getElementById('rule-msg').value;
            if (!k || !msg) { toast('请填写关键词与提示', 'error'); return; }
            currentState.rules.push({ id: Date.now(), field: f, keyword: k, message: msg, score: 10, compareField: 'none', compareKeyword: '' });
            renderStep8();
            toast('规则已添加');
        }

        function removeRule(id) {
            currentState.rules = currentState.rules.filter(r => r.id !== id);
            renderStep8();
        }

        function addTmpStep() {
            const name = document.getElementById('tmp-step-name').value.trim();
            if (!name) return;
            const type = document.getElementById('tmp-step-type').value;
            const time = parseInt(document.getElementById('tmp-step-time').value, 10) || 1;
            const scEl = document.getElementById('tmp-step-scenarios');
            const coEl = document.getElementById('tmp-step-components');
            const scenarios = scEl ? scEl.value.trim() : '';
            const components = coEl ? coEl.value.trim() : '';
            currentState.newTplSteps.push({ id: Date.now() + Math.floor(Math.random() * 1000), name, type, defaultTime: time, scenarios, components });
            renderTempStepsList();
            document.getElementById('tmp-step-name').value = '';
        }

        function removeTmpStep(id) {
            currentState.newTplSteps = currentState.newTplSteps.filter(s => s.id !== id);
            renderTempStepsList();
        }

        /** 将模板阶段载入上方编辑器（内置与自定义均可修改后保存） */
        function beginEditTemplate(key) {
            const t = currentState.templates[key];
            if (!t || !t.stages || !t.stages.length) {
                toast('模板无效', 'error');
                return;
            }
            currentState.editingTemplateKey = key;
            currentState.newTplSteps = t.stages.map((s, i) => ({
                id: Date.now() + i,
                name: s.name || `阶段 ${i + 1}`,
                type: s.type === 'wait' ? 'wait' : 'process',
                defaultTime: s.defaultTime != null ? parseInt(s.defaultTime, 10) || 1 : (parseInt(s.actualTime, 10) || 1),
                scenarios: s.scenarios || '',
                components: s.components || ''
            }));
            renderStep8();
            toast('已载入模板，可在上方修改名称与阶段后保存');
        }

        function cancelTemplateEdit() {
            currentState.editingTemplateKey = null;
            currentState.newTplSteps = [];
            renderStep8();
        }

        function saveTemplate() {
            const name = document.getElementById('tpl-name').value.trim();
            if (!name || !currentState.newTplSteps.length) {
                toast('请输入模板名并添加阶段', 'error');
                return;
            }
            const stages = currentState.newTplSteps.map((s, idx) => ({
                id: idx + 1,
                name: s.name,
                type: s.type === 'wait' ? 'wait' : 'process',
                defaultTime: parseInt(s.defaultTime, 10) || 1,
                scenarios: s.scenarios || '',
                components: s.components || ''
            }));
            const inds = collectTemplateIndustriesFromForm();
            const editKey = currentState.editingTemplateKey;
            if (editKey && currentState.templates[editKey]) {
                const payload = { name, stages };
                if (inds.length) payload.industries = inds;
                currentState.templates[editKey] = payload;
                currentState.editingTemplateKey = null;
                currentState.newTplSteps = [];
                renderStep8();
                renderStep2();
                ensureSelectedTemplateForIndustry();
                toast('模板已更新（含适用行业设置）');
                return;
            }
            const key = 'custom_' + Date.now();
            const payloadNew = { name, stages };
            if (inds.length) payloadNew.industries = inds;
            currentState.templates[key] = payloadNew;
            currentState.newTplSteps = [];
            renderStep8();
            renderStep2();
            ensureSelectedTemplateForIndustry();
            toast(`模板已保存，可在「${stepLabel(2)}」选用该模板`);
        }

        function renderNav() {
            document.getElementById('nav-list').innerHTML = STEPS.map(s => {
                const active = currentState.activePanel === 'workflow' && s.id === currentState.step;
                const cls = active
                    ? 'bg-accent-muted text-accent shadow-nav ring-1 ring-[rgba(0,113,227,0.18)]'
                    : 'text-ink-secondary hover:bg-canvas hover:text-ink';
                return `<button type="button" onclick="setStep(${s.id})" class="w-full flex items-start gap-2.5 rounded-[10px] px-2.5 py-2 text-left transition-all ${cls}">
                    <span class="flex h-8 min-w-[2rem] shrink-0 flex-col items-center justify-center rounded-md leading-none ${active ? 'bg-accent text-white' : 'bg-canvas text-ink-tertiary'}">
                        <span class="text-[12px] font-bold">${s.id}</span>
                        <span class="text-[9px] font-semibold opacity-80 mt-px">/${STEP_TOTAL}</span>
                    </span>
                    <span class="nav-step-title text-[12px] font-semibold leading-snug pt-0.5">${s.title}</span>
                </button>`;
            }).join('');
            const cfgBtn = document.getElementById('nav-config-btn');
            if (cfgBtn) {
                const cfgOn = currentState.activePanel === 'config';
                cfgBtn.className = `print-hidden w-full flex items-center gap-2 rounded-[10px] px-3 py-2 text-left transition-all border lg:py-1.5 ${cfgOn ? 'border-accent/30 bg-accent-muted text-accent shadow-nav ring-1 ring-[rgba(0,113,227,0.18)]' : 'border-black/[0.06] bg-white shadow-nav text-ink-secondary hover:bg-canvas hover:text-ink'}`;
            }
            renderSidebarHistoryPanel();
            updateWorkflowFooter();
        }

        function renderStep() {
            document.querySelectorAll('.step-wrapper').forEach(el => el.classList.remove('active'));
            if (currentState.activePanel === 'config') {
                const el8 = document.getElementById('step-8');
                el8.classList.add('active');
                renderStep8();
                updateWorkflowFooter();
                refreshAiAssistantUi();
                return;
            }
            const container = document.getElementById('step-' + currentState.step);
            container.classList.add('active');
            switch (currentState.step) {
                case 1: renderStep1(); break;
                case 2: renderStep2(); break;
                case 3: renderStep3(); break;
                case 4: renderStep4(); break;
                case 5: renderStep5(); break;
                case 6: renderStep6(); break;
                case 7: renderStep7(); break;
            }
            updateWorkflowFooter();
            refreshAiAssistantUi();
        }

        function renderStep1() {
            const bmcCell = (key, layoutCls) => {
                const label = FIELD_MAP[key];
                const val = currentState.bmc[key];
                const vp = key === 'valuePropositions' ? ' ring-1 ring-accent/12 bg-accent-muted/45' : '';
                return `                <div class="flex flex-col min-h-0 h-full bg-white p-2.5 sm:p-3 ${vp} ${layoutCls}">
                    <label class="text-[11px] font-semibold text-ink-tertiary uppercase tracking-wider mb-1.5 shrink-0">${label}</label>
                    <textarea class="flex-1 w-full min-h-0 resize-none text-[12px] text-ink leading-relaxed bg-transparent outline-none placeholder:text-ink-tertiary/80" placeholder="简要填写…" oninput="currentState.bmc['${key}']=this.value">${val}</textarea>
                </div>`;
            };

            /** 经典 BMC 9 宫格：中间主区 flex-1 占满工作区剩余高度；禁止 max-h 压扁画布 */
            const gridHtml = `
            <div class="bmc-nine flex flex-col flex-1 min-h-0 rounded-[14px] border border-black/[0.08] overflow-hidden bg-black/[0.06] shadow-nav">
                <div class="shrink-0 grid grid-cols-2 gap-0 bg-canvas/90 py-1.5 text-center text-[11px] font-semibold text-ink-secondary tracking-wide border-b border-black/[0.06]">
                    <span>左侧：产生成本</span>
                    <span>右侧：带来收入</span>
                </div>
                <div class="bmc-nine-main flex-1 min-h-0 min-w-0 grid grid-cols-5 grid-rows-[minmax(0,1fr)_minmax(0,1fr)] gap-px p-px overflow-auto">
                    ${bmcCell('keyPartners', 'col-start-1 row-start-1 row-span-2 min-h-0')}
                    ${bmcCell('keyActivities', 'col-start-2 row-start-1 min-h-0')}
                    ${bmcCell('keyResources', 'col-start-2 row-start-2 min-h-0')}
                    ${bmcCell('valuePropositions', 'col-start-3 row-start-1 row-span-2 min-h-0')}
                    ${bmcCell('customerRelationships', 'col-start-4 row-start-1 min-h-0')}
                    ${bmcCell('channels', 'col-start-4 row-start-2 min-h-0')}
                    ${bmcCell('customerSegments', 'col-start-5 row-start-1 row-span-2 min-h-0')}
                </div>
                <div class="shrink-0 grid grid-cols-2 gap-px p-px border-t border-black/[0.06] auto-rows-[minmax(0,1fr)] min-h-[5rem]">
                    ${bmcCell('costStructure', 'min-h-0')}
                    ${bmcCell('revenueStreams', 'min-h-0')}
                </div>
            </div>`;

            let reportHtml = '';
            if (currentState.bmcReport) {
                const { score, risks, suggestions } = currentState.bmcReport;
                reportHtml = `<div class="shrink-0 rounded-[14px] bg-ink p-4 text-white shadow-card max-h-[min(36vh,300px)] overflow-y-auto">
                    <div class="flex flex-wrap justify-between items-start gap-3 mb-3">
                        <div>
                            <p class="text-[11px] font-semibold text-white/50 uppercase tracking-wider">智能诊断</p>
                            <h3 class="text-[15px] lg:text-[16px] font-semibold mt-0.5">规则库检查结果</h3>
                        </div>
                        <div class="text-right">
                            <p class="text-[11px] text-white/50">综合得分</p>
                            <p class="text-[24px] lg:text-[26px] font-semibold tabular-nums leading-none mt-0.5 ${score > 80 ? 'text-[#34c759]' : 'text-[#ffcc00]'}">${score}</p>
                        </div>
                    </div>
                    <div class="grid md:grid-cols-2 gap-3 text-[12px] lg:text-[13px] leading-relaxed border-t border-white/10 pt-3">
                        <div><p class="text-[13px] font-semibold text-[#ff6961] mb-2">需关注</p><ul class="space-y-2 text-white/75">${risks.length ? risks.map(r => `<li class="flex gap-2"><span class="text-white/40">—</span>${r}</li>`).join('') : '<li class="text-white/50">未命中预警规则</li>'}</ul></div>
                        <div><p class="text-[13px] font-semibold text-accent-hover mb-2">建议</p><ul class="space-y-2 text-white/75">${suggestions.map(s => `<li class="flex gap-2"><span class="text-white/40">—</span>${s}</li>`).join('')}</ul></div>
                    </div></div>`;
            }

            document.getElementById('step-1').innerHTML = `
                <div class="flex flex-col flex-1 min-h-0 gap-2 lg:gap-2">
                ${methodBlock('s1')}
                <div class="flex items-start gap-2 sm:gap-3 shrink-0 print-hidden">
                    ${workspaceSidebarToggleHtml()}
                    <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-2 sm:gap-3 flex-1 min-w-0">
                        ${stepPageHeading(1, 'flex-1')}
                        <div class="flex flex-wrap items-center gap-2 shrink-0">
                            <select id="bmc-industry-select" aria-label="行业（筛选步骤 2 价值流模板）" class="inline-flex shrink-0 items-center rounded-[10px] border border-black/[0.12] bg-white px-3 py-2 lg:py-1.5 text-[12px] lg:text-[13px] font-semibold text-ink-secondary shadow-nav hover:bg-canvas hover:text-ink transition-colors focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/20 min-w-[6.75rem]" onchange="setWorkflowIndustry(this.value)" title="行业：决定步骤 2「领域价值流模板」可见范围（与资产配置模板适用行业一致）">
                                    ${WORKFLOW_INDUSTRIES.map(ind => `<option value="${ind}" ${currentState.workflowIndustry === ind ? 'selected' : ''}>${ind}</option>`).join('')}
                                </select>
                            <button type="button" onclick="exportBmcExcel()" class="inline-flex items-center justify-center gap-1.5 rounded-[10px] border border-black/[0.12] bg-white px-3 py-2 lg:py-1.5 text-[12px] lg:text-[13px] font-semibold text-ink-secondary shadow-nav hover:bg-canvas hover:text-ink transition-colors" title="下载含说明与当前内容的模板，Excel 改完后可导入">
                                <i class="fas fa-file-export text-[11px]" aria-hidden="true"></i>

        function resolveJsPdfConstructor() {
            if (window.jspdf && typeof window.jspdf.jsPDF === 'function') return window.jspdf.jsPDF;
            if (typeof window.jsPDF === 'function') return window.jsPDF;
            return null;
        }

        /** PDF：A4 纵向；分页切片 PNG；允许较大体积（目标约 10～20MB）以还原快照、减轻糊字与裁切 */
        const PDF_PAGE_W_MM = 210;
        const PDF_PAGE_H_MM = 297;
        const PDF_MARGIN_MM = 10;
        const PDF_IMG_W_MM = PDF_PAGE_W_MM - 2 * PDF_MARGIN_MM;
        const PDF_USABLE_H_MM = PDF_PAGE_H_MM - 2 * PDF_MARGIN_MM;
        /** 捕获缩放：略提高 dpi，中文笔画更清晰（文件更大可接受） */
        const PDF_CAPTURE_SCALE = Math.min(3, Math.max(2.75, typeof window !== 'undefined' && window.devicePixelRatio ? window.devicePixelRatio * 1.65 : 3));
        /** 分页切片用 PNG，避免 JPEG 块效应造成笔画粘连、行间错位感 */
        const PDF_SLICE_FORMAT = 'PNG';
        /** 仅当单页 canvas 极大时再缩小；提高上限减少非必要降采样导致的糊边 */
        const PDF_CANVAS_MAX_EDGE_PX = 10000;

        function downscaleCanvasIfNeeded(canvas) {
            const edge = Math.max(canvas.width, canvas.height);
            if (edge <= PDF_CANVAS_MAX_EDGE_PX) return canvas;
            const s = PDF_CANVAS_MAX_EDGE_PX / edge;
            const w = Math.max(1, Math.round(canvas.width * s));
            const h = Math.max(1, Math.round(canvas.height * s));
            const out = document.createElement('canvas');
            out.width = w;
            out.height = h;
            const ctx = out.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(canvas, 0, 0, w, h);
            return out;
        }

        /** 将步骤截图按 A4 可用高度纵向切片为多页写入（PNG 保文字边缘清晰；函数名历史遗留含 Jpeg） */
        function appendCanvasToPdfAsPagedJpeg(pdf, canvas, opts) {
            const needLeading = !!(opts && opts.needLeadingPageBreak);
            const margin = PDF_MARGIN_MM;
            const imgW = PDF_IMG_W_MM;
            const usableH = PDF_USABLE_H_MM;

            const maxPxSlice = Math.max(32, Math.floor((usableH * canvas.width) / imgW));

            let yPx = 0;
            let first = true;

            while (yPx < canvas.height) {
                const slicePx = Math.min(maxPxSlice, canvas.height - yPx);
                let sliceHmm = (slicePx * imgW) / canvas.width;
                sliceHmm = Math.round(sliceHmm * 1000) / 1000;
                if (sliceHmm > usableH) sliceHmm = usableH;

                if (!first) {
                    pdf.addPage();
                } else if (needLeading) {
                    pdf.addPage();
                }
                first = false;

                const sliceCv = document.createElement('canvas');
                sliceCv.width = canvas.width;
                sliceCv.height = slicePx;
                const ctx = sliceCv.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, sliceCv.width, sliceCv.height);
                ctx.drawImage(canvas, 0, yPx, canvas.width, slicePx, 0, 0, canvas.width, slicePx);

                const dataUrl = PDF_SLICE_FORMAT === 'PNG'
                    ? sliceCv.toDataURL('image/png')
                    : sliceCv.toDataURL('image/jpeg', 0.92);
                pdf.addImage(dataUrl, PDF_SLICE_FORMAT, margin, margin, imgW, sliceHmm);

                yPx += slicePx;
            }
        }

        async function waitForFontsReady() {
            try {
                if (document.fonts && typeof document.fonts.ready !== 'undefined') await document.fonts.ready;
            } catch (_) { /* ignore */ }
        }

        /** @param {string} [filename] 下载文件名 */
        async function runPdfExportCore(filename) {
            const JsPDF = resolveJsPdfConstructor();
            if (!JsPDF || typeof html2canvas !== 'function') {
                toast('PDF 组件未加载（jspdf / html2canvas），请检查网络后重试', 'error');
                return false;
            }

            toast('正在生成 PDF…', 'loading');
            const workspace = document.getElementById('workspace');
            const sidebar = document.getElementById('sidebar');
            const hdr = document.getElementById('app-header');
            const footer = document.getElementById('footer-nav');
            if (!workspace) {
                toast('页面结构异常，无法导出', 'error');
                return false;
            }
            const originalClass = workspace.className;
            if (sidebar) sidebar.style.display = 'none';
            if (hdr) hdr.style.display = 'none';
            if (footer) footer.style.display = 'none';
            workspace.classList.add('w-[210mm]', 'mx-auto', 'shadow-none', 'border-0');

            /** 须先于 refreshAllStepsDomForPdf：否则 grid/flex 仍为一屏模式，子步骤高度塌成 0 */
            document.body.classList.add('pdf-exporting');

            refreshAllStepsDomForPdf();
            document.querySelectorAll('.step-wrapper').forEach(el => el.classList.add('active'));

            const wsScroll = document.getElementById('workspace-scroll');
            if (wsScroll) wsScroll.scrollTop = 0;

            void workspace.offsetHeight;
            void document.getElementById('main-layout')?.offsetHeight;
            await waitForFontsReady();
            await waitForLayoutMs(520);

            try {
                const pdf = new JsPDF({
                    orientation: 'p',
                    unit: 'mm',
                    format: 'a4',
                    compress: false
                });
                const contentIds = ['step-1', 'step-2', 'step-3', 'step-4', 'step-5', 'step-6', 'step-7', 'step-8'];
                for (let i = 0; i < contentIds.length; i++) {
                    const el = document.getElementById(contentIds[i]);
                    if (!el) throw new Error(`缺少节点 ${contentIds[i]}`);
                    if (i > 0) await waitForLayoutMs(72);
                    void el.offsetWidth;
                    void el.scrollHeight;
                    const canvas = await html2canvas(el, {
                        scale: PDF_CAPTURE_SCALE,
                        useCORS: true,
                        allowTaint: true,
                        logging: false,
                        imageTimeout: 20000,
                        backgroundColor: '#ffffff',
                        letterRendering: false,
                        foreignObjectRendering: false,
                        onclone: (clonedDoc) => {
                            clonedDoc.body.classList.add('pdf-exporting');
                            const wEl = clonedDoc.getElementById('workspace');
                            if (wEl) {
                                wEl.style.fontFamily = '-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei",sans-serif';
                            }
                            clonedDoc.querySelectorAll('.overflow-y-auto').forEach((node) => {
                                node.style.overflow = 'visible';
                                node.style.maxHeight = 'none';
                            });
                            clonedDoc.querySelectorAll('.overflow-auto').forEach((node) => {
                                node.style.overflow = 'visible';
                                node.style.maxHeight = 'none';
                            });
                            clonedDoc.querySelectorAll('.overflow-x-auto').forEach((node) => {
                                node.style.overflowX = 'visible';
                            });
                        }
                    });
                    if (!canvas.width || !canvas.height) {
                        throw new Error(`${contentIds[i]} 截图尺寸为 0，请确认工作台已展开可见`);
                    }
                    const canvasForPdf = downscaleCanvasIfNeeded(canvas);
                    appendCanvasToPdfAsPagedJpeg(pdf, canvasForPdf, { needLeadingPageBreak: i > 0 });
                }
                pdf.save(filename || 'BA_Transformation_Blueprint.pdf');
                toast('PDF 已保存');
                return true;
            } catch (e) {
                console.error(e);
                toast(`导出失败：${e && e.message ? e.message : '请查看控制台'}`, 'error');
                return false;
            } finally {
                document.body.classList.remove('pdf-exporting');
                if (sidebar) sidebar.style.display = '';
                if (hdr) hdr.style.display = '';
                if (footer) footer.style.display = '';
                workspace.className = originalClass;
                document.querySelectorAll('.step-wrapper').forEach(el => el.classList.remove('active'));
            }
        }
    </script>
</body>
