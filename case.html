<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例 · 友为</title>
    <link rel="stylesheet" href="css/brand.css">
    <style>
        .nav {
            position: sticky; top: 0; z-index: 40;
            backdrop-filter: saturate(160%) blur(18px);
            background: rgba(250, 249, 246, .82);
            border-bottom: 1px solid var(--line);
        }
        .nav-inner {
            max-width: var(--page); margin: 0 auto;
            padding: 0 var(--gutter); height: 64px;
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
        }
        .nav-links { display: flex; align-items: center; gap: 18px; font-size: 14px; color: var(--muted); }
        .nav-links a { text-decoration: none; }
        .nav-links a:hover { color: var(--ink); }
        .pill {
            display: inline-flex; align-items: center;
            background: var(--sage); color: #f7f6f2 !important;
            border-radius: 980px; padding: 7px 14px; font-weight: 550;
        }
        .pill:hover { background: var(--sage-hover); }
        .hero { padding: 72px 22px 36px; text-align: center; background: var(--canvas); }
        .kicker {
            font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
            color: var(--sage); font-weight: 650; margin: 0 0 14px;
        }
        h1 {
            margin: 0 auto 16px; max-width: 20em;
            font-size: clamp(28px, 5vw, 56px); line-height: 1.15;
            font-weight: 600; letter-spacing: -.03em;
        }
        .lead {
            margin: 0 auto; max-width: 36rem;
            font-size: 18px; line-height: 1.5; color: var(--muted);
        }
        .actions { margin-top: 28px; display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; }
        .text-link { color: var(--sage); text-decoration: none; font-size: 16px; }
        .text-link:hover { text-decoration: underline; }
        .metric-band {
            max-width: var(--page); margin: 0 auto; padding: 28px var(--gutter) 48px;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
        }
        .metric {
            background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 24px 22px;
        }
        .metric b { display: block; font-size: 30px; letter-spacing: -.03em; font-weight: 600; }
        .metric span { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); line-height: 1.45; }
        .wrap { max-width: 760px; margin: 0 auto; padding: 0 var(--gutter) 88px; }
        .block { margin-bottom: 44px; }
        .block h2 { font-size: 26px; letter-spacing: -.03em; margin: 0 0 12px; font-weight: 620; color: var(--ink); }
        .block p { margin: 0; font-size: 17px; line-height: 1.65; color: var(--ink); }
        .facts { margin: 16px 0 0; padding: 0; list-style: none; }
        .facts li {
            margin: 0 0 10px; padding-left: 14px; position: relative;
            font-size: 16px; line-height: 1.6; color: var(--ink);
        }
        .facts li::before {
            content: ''; position: absolute; left: 0; top: .62em;
            width: 6px; height: 6px; border-radius: 50%; background: var(--sage);
        }
        .source { margin-top: 14px; font-size: 13px !important; color: var(--dim) !important; line-height: 1.6; }
        .refs { margin: 12px 0 0; padding: 0; list-style: none; }
        .refs a { color: var(--sage); text-decoration: none; font-size: 14px; font-weight: 550; }
        .refs a:hover { text-decoration: underline; }
        .refs li { margin: 0 0 6px; }
        .ev-pill {
            display: inline-flex; margin: 10px 0 0;
            font-size: 11px; font-weight: 650;
            padding: 4px 9px; border-radius: 980px;
            background: var(--sage-soft); color: var(--sage);
        }
        .scqa-label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--sage); font-weight: 650; margin: 0 0 8px; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
        .chip {
            font-size: 12px; padding: 6px 10px; border-radius: 980px;
            background: var(--canvas); color: var(--ink);
        }
        .ini { display: grid; gap: 10px; margin-top: 18px; }
        .ini article {
            display: grid; grid-template-columns: 44px 1fr; gap: 14px;
            padding: 16px 0; border-top: 1px solid var(--line);
        }
        .ini article:last-child { border-bottom: 1px solid var(--line); }
        .phase { font-size: 12px; font-weight: 650; color: var(--sage); padding-top: 3px; }
        .missing { padding: 120px 22px; text-align: center; }
        footer {
            border-top: 1px solid var(--line);
            padding: 28px 22px 48px; color: var(--dim); font-size: 12px;
        }
        .footer-inner { max-width: 1080px; margin: 0 auto; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        @media (max-width: 720px) {
            .metric-band { grid-template-columns: 1fr; }
            .nav-links a.hide-sm { display: none; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a class="brand" href="index.html">
                <span class="brand-cn">友为</span>
                <span class="brand-en">Yoway</span>
            </a>
            <div class="nav-end">
                <div class="nav-links">
                    <a class="hide-sm" href="index.html#method" data-i18n="navMethod">方法</a>
                    <a class="hide-sm" href="index.html#cases" data-i18n="navScenes">场景</a>
                    <a class="hide-sm" href="index.html#deliverables" data-i18n="navTake">带走</a>
                    <a class="pill" href="workshop.html?mode=pro" data-i18n="cta">开始评估</a>
                </div>
                <button type="button" class="lang-sw" id="lang-sw" aria-label="Language">en</button>
            </div>
        </div>
    </nav>
    <div id="app"></div>
    <footer>
        <div class="footer-inner">
            <span data-i18n="footerLeft">友为 · 从战略到路标</span>
            <span>行业场景供评估对照，目标数字请用贵司数据确认。</span>
        </div>
    </footer>
    <script src="js/i18n.js"></script>
    <script src="js/cases-data.js"></script>
    <script src="js/ops-store.js"></script>
    <script src="js/accounts.js"></script>
    <script src="js/accounts.local.js"></script>
    <script src="js/auth-gate.js"></script>
    <script>YouweiAuth.initPublic();</script>
    <script>
        (function () {
            if (window.YouweiI18n) {
                YouweiI18n.applyStatic();
                YouweiI18n.bindToggle();
            }
            const params = new URLSearchParams(location.search);
            const item = window.getWendaoCaseById(params.get('id'));
            const app = document.getElementById('app');
            if (!item) {
                document.title = '未找到这条场景 · 友为';
                app.innerHTML = '<div class="missing"><h1>没有这条场景</h1><p class="lead" style="margin-top:16px">回到首页继续浏览。</p><p class="actions"><a class="text-link" href="index.html">返回首页</a></p></div>';
                return;
            }
            document.title = item.title + ' · 友为';
            const esc = (s) => String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
            const studio = 'workshop.html?case=' + encodeURIComponent(item.id) + '&mode=pro';
            const ev = item.evidence || { status: 'assumption', baseline: '—', target: item.metric.label, note: '评估目标' };
            const evLabel = ev.status === 'confirmed' ? '已确认' : '评估目标';
            const facts = item.publicFacts || [];
            const refs = item.references || [];
            const factBlock = facts.length ? `
                    <section class="block">
                        <p class="scqa-label">公开对照</p>
                        <h2>可信信源里怎么做</h2>
                        ${item.sourceNote ? `<p class="source">${esc(item.sourceNote)}</p>` : ''}
                        <ul class="facts">${facts.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>
                        ${refs.length ? `<ul class="refs">${refs.map((r) => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.label)}</a></li>`).join('')}</ul>` : ''}
                    </section>` : '';
            app.innerHTML = `
                <header class="hero">
                    <p class="kicker">${esc(item.kicker)}</p>
                    <h1>${esc(item.title)}</h1>
                    <p class="lead">${esc(item.tagline)}</p>
                    <div class="actions">
                        <a class="pill" href="${studio}">用此场景开始评估</a>
                        <a class="text-link" href="index.html#cases">返回行业案例</a>
                    </div>
                </header>
                <section class="metric-band">
                    <div class="metric">
                        <b>${esc(item.metric.value)}</b>
                        <span>${esc(item.metric.label)}</span>
                        <span class="ev-pill">${evLabel} · 需用贵司数据校准</span>
                    </div>
                    <div class="metric"><b>现在常见情况</b><span>${esc(ev.baseline || '待您填入现状')}</span></div>
                    <div class="metric"><b>评估目标</b><span>${esc(ev.target || item.metric.label)}</span></div>
                </section>
                <main class="wrap">
                    <section class="block">
                        <p class="scqa-label">背景</p>
                        <h2>业务长什么样</h2>
                        <p>${esc(item.situation || item.subtitle)}</p>
                    </section>
                    <section class="block">
                        <p class="scqa-label">卡点</p>
                        <h2>为什么现在要动手</h2>
                        <p>${esc(item.complication || item.challenge)}</p>
                    </section>
                    ${factBlock}
                    <section class="block">
                        <p class="scqa-label">做法</p>
                        <h2>评估会顺着哪条链看</h2>
                        <p>${esc(item.approach)}</p>
                        <div class="chips">${(item.highlights || []).map((h) => `<span class="chip">${esc(h)}</span>`).join('')}</div>
                    </section>
                    <section class="block">
                        <p class="scqa-label">结果</p>
                        <h2>如果做成，会看到什么</h2>
                        <p>${esc(item.outcome)}</p>
                        <p style="margin-top:12px;font-size:14px;color:var(--dim)">${esc(ev.note || '')}</p>
                        <div class="ini">
                            ${(item.initiativesPreview || []).map((x) => `<article><div class="phase">${esc(x.phase)}</div><div>${esc(x.title)}</div></article>`).join('')}
                        </div>
                    </section>
                    <section class="block">
                        <p class="scqa-label">下一步</p>
                        <h2>用贵司情况改写这条场景</h2>
                        <p>公开做法只供对照。进入工作台后，按您自己的业务补名称和负责人，写成能力视图与变革规划。</p>
                        <p class="actions" style="justify-content:flex-start;margin-top:20px">
                            <a class="pill" href="${studio}">开始评估</a>
                            <a class="text-link" href="index.html#cases">看其它场景</a>
                        </p>
                    </section>
                </main>
            `;
        })();
    </script>
</body>
</html>
