<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评估成果 · 友为</title>
    <link rel="stylesheet" href="css/brand.css">
    <style>
        .nav {
            position: sticky; top: 0; z-index: 40;
            backdrop-filter: saturate(160%) blur(18px);
            background: rgba(247, 245, 240, .92);
            border-bottom: 1px solid var(--line);
        }
        .nav-inner, .stage, .foot-inner {
            max-width: var(--page); margin: 0 auto;
            padding-left: var(--gutter); padding-right: var(--gutter);
        }
        .nav-inner {
            height: 64px;
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
        }
        .nav-links { display: flex; align-items: center; gap: 18px; font-size: 14px; color: var(--muted); }
        .nav-links a { text-decoration: none; }
        .nav-links a:hover { color: var(--ink); }
        .page { max-width: var(--page); margin: 0 auto; padding: 36px var(--gutter) 72px; }
        .layout {
            display: grid; grid-template-columns: 168px minmax(0, 1fr);
            gap: 40px; align-items: start;
        }
        .toc { position: sticky; top: 88px; padding: 4px 0 8px; }
        .toc p { margin: 0 0 10px; font-size: 11px; letter-spacing: .08em; color: var(--sage); font-weight: 650; }
        .toc a {
            display: block; text-decoration: none; font-size: 13px; line-height: 1.35;
            padding: 7px 0 7px 12px; color: var(--muted); border-left: 2px solid transparent;
        }
        .toc a:hover, .toc a.is-on { color: var(--ink); border-left-color: var(--sage); }
        .col { max-width: 36rem; }
        .head { padding: 8px 0 24px; }
        .kicker { margin: 0 0 10px; font-size: 13px; font-weight: 650; color: var(--sage); }
        .who { margin: 0 0 8px; font-size: 14px; color: var(--sage); font-weight: 550; }
        h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); font-weight: 600; letter-spacing: -.03em; }
        .back { font-size: 15px; color: var(--sage); text-decoration: none; }
        .back:hover { text-decoration: underline; }
        .one { margin: 12px 0 0; font-size: 17px; color: var(--muted); line-height: 1.55; }
        .actions { margin-top: 22px; display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
        .btn-sage {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 148px; height: 40px; padding: 0 18px;
            border-radius: 980px; background: var(--sage); color: #f7f6f2;
            text-decoration: none; font-size: 14px; font-weight: 600;
        }
        .btn-sage:hover { background: var(--sage-hover); }
        .block { margin: 0 0 40px; scroll-margin-top: 96px; }
        .block h2 { margin: 0 0 12px; font-size: 22px; font-weight: 620; letter-spacing: -.03em; }
        .block p { margin: 0; font-size: 16px; line-height: 1.65; }
        .scqa-label { font-size: 12px; letter-spacing: .06em; color: var(--sage); font-weight: 650; margin: 0 0 8px; }
        .goal-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
        .goal-card { background: var(--canvas); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
        .goal-card b { display: block; font-size: 12px; color: var(--sage); margin-bottom: 8px; font-weight: 650; }
        .goal-card p { font-size: 15px; line-height: 1.55; margin: 0; }

        .figure {
            margin-top: 20px; width: 100%;
            background: #fff; border: 1px solid var(--line); overflow: hidden;
        }
        .fig-label {
            padding: 10px 16px; font-size: 12px; color: var(--dim);
            border-bottom: 1px solid var(--line); background: var(--canvas);
        }

        .arch { padding: 20px; }
        .four-a { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
        .four-a article { background: var(--sage-soft); padding: 14px 12px; }
        .four-a em { display: block; font-style: normal; font-size: 11px; font-weight: 650; color: var(--sage); }
        .four-a b { display: block; margin-top: 4px; font-size: 14px; }
        .four-a p { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
        .arch-split { display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; }
        .gap-mini { border: 1px solid var(--line); }
        .gap-mini table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .gap-mini th, .gap-mini td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); }
        .gap-mini th { color: var(--dim); font-weight: 550; background: var(--canvas); }
        .gap-mini td:not(:first-child) { color: var(--dim); }
        .heat-mini { display: grid; gap: 8px; }
        .tile { padding: 12px 14px; color: #f7f6f2; }
        .tile b { display: block; font-size: 14px; font-weight: 600; }
        .tile i { display: block; margin-top: 6px; font-style: normal; font-size: 11px; opacity: .85; }
        .tile.is-r { background: #8d4a3a; }
        .tile.is-y { background: #b0893e; }
        .tile.is-g { background: #3d534b; }

        .heat { padding: 20px 20px 24px; }
        .heat-dims {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 8px; margin-bottom: 14px;
        }
        .heat-dims span {
            text-align: center; font-size: 12px; font-weight: 650; color: var(--sage);
            padding: 8px 0; background: var(--sage-soft);
        }
        .heat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .tile { padding: 16px 14px 14px; color: #f7f6f2; min-height: 88px; }
        .tile b { display: block; font-size: 15px; font-weight: 600; }
        .tile i { display: block; margin-top: 8px; font-style: normal; font-size: 12px; opacity: .85; }
        .tile.is-r { background: #8d4a3a; }
        .tile.is-y { background: #b0893e; }
        .tile.is-g { background: #3d534b; }

        .gantt { padding: 22px 20px 26px; }
        .gantt-axis {
            display: grid; grid-template-columns: 5.5rem 1fr;
            font-size: 12px; color: var(--dim); margin-bottom: 10px;
        }
        .gantt-axis ol { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0; padding: 0; list-style: none; }
        .grow {
            display: grid; grid-template-columns: 5.5rem 1fr;
            gap: 10px; align-items: center; margin: 10px 0;
        }
        .grow b { font-size: 13px; font-weight: 650; }
        .track { position: relative; height: 28px; background: var(--sand); }
        .bar { position: absolute; top: 6px; height: 16px; }
        .bar.p0 { left: 2%; width: 30%; background: var(--sage); }
        .bar.p1 { left: 34%; width: 30%; background: #6d7f78; }
        .bar.p2 { left: 66%; width: 30%; background: #a8b4ae; }
        .grow small { grid-column: 2; font-size: 12px; color: var(--muted); }

        .pack { padding: 22px 20px 26px; }
        .sheets { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
        .sheet {
            aspect-ratio: 3 / 4; background: var(--canvas);
            border: 1px solid var(--line); padding: 10px 8px;
            display: flex; flex-direction: column; justify-content: flex-end;
        }
        .sheet em { font-style: normal; font-size: 11px; color: var(--sage); font-weight: 650; }
        .sheet b { display: block; margin-top: 4px; font-size: 13px; font-weight: 600; line-height: 1.3; }
        .sheet .lines { flex: 1; margin-bottom: 8px; }
        .sheet .lines i {
            display: block; height: 3px; background: var(--line); margin: 5px 0;
            font-style: normal;
        }

        .how { padding: 0; display: grid; gap: 0; }
        .how article {
            display: grid; grid-template-columns: 44px 1fr; gap: 14px;
            padding: 14px 0; border-top: 1px solid var(--line);
        }
        .how article:last-child { border-bottom: 1px solid var(--line); }
        .how .n { font-size: 12px; font-weight: 650; color: var(--sage); padding-top: 3px; }
        .how h3 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
        .how p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.55; }

        .missing { padding: 120px var(--gutter); text-align: center; }
        footer { padding: 36px 0 48px; font-size: 13px; color: var(--dim); }
        .foot-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        @media (max-width: 900px) {
            .nav-links a.hide-sm { display: none; }
            .layout { grid-template-columns: 1fr; }
            .toc {
                position: sticky; top: 64px; z-index: 30;
                display: flex; flex-wrap: nowrap; gap: 4px;
                overflow-x: auto; padding: 10px 0 8px; margin: 0 0 18px;
                background: rgba(247, 245, 240, .94); border-bottom: 1px solid var(--line);
            }
            .toc p { display: none; }
            .toc a { border-left: 0; border-bottom: 2px solid transparent; padding: 6px 10px; white-space: nowrap; }
            .toc a:hover, .toc a.is-on { border-left-color: transparent; border-bottom-color: var(--sage); }
            .four-a, .arch-split, .goal-split { grid-template-columns: 1fr; }
            .bmc-grid { min-height: 0; }
            .bmc-cell { min-height: 64px; }
            .sheets { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }
        @media (max-width: 640px) {
            .sheets { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a class="brand" href="index.html">
                <span class="brand-cn">友为</span>
                <span class="brand-en">Yoway</span>
            </a>
            <div class="nav-end">
                <div class="nav-links">
                    <a class="hide-sm" href="index.html#cases" data-i18n="navScenes">行业案例</a>
                    <a class="hide-sm" href="index.html#method" data-i18n="navMethod">诊断方法</a>
                    <a class="hide-sm" href="index.html#deliverables" data-i18n="navTake">评估成果</a>
                </div>
                <a class="yoway-wake nav-cta" href="workshop.html?mode=pro" aria-label="唤醒 YOWAY">
                    <span class="yoway-orb" aria-hidden="true">
                        <span class="yoway-orb-glow"></span>
                        <span class="yoway-orb-orbit"></span>
                        <span class="yoway-orb-body">
                            <span class="yoway-orb-shine"></span>
                            <span class="yoway-orb-visor"><i></i><i></i></span>
                        </span>
                        <span class="yoway-orb-ear is-l"></span>
                        <span class="yoway-orb-ear is-r"></span>
                        <span class="yoway-orb-burst"></span>
                    </span>
                    <span class="yoway-wake-txt"><small data-i18n="wakeVerb">唤醒</small><b>YOWAY</b></span>
                </a>
                <button type="button" class="lang-sw" id="lang-sw" aria-label="Switch language">EN</button>
            </div>
        </div>
    </nav>
    <div id="app"></div>
    <footer>
        <div class="foot-inner">
            <span data-i18n="footerLeft">友为 · 从战略到路标</span>
            <span>
                <a href="legal.html" data-i18n="footerLegal">使用与隐私</a>
                ·
                <a href="install.html" data-i18n="footerInstall">安装说明</a>
                ·
                <span data-i18n="sampleNote">示意图为空模板，数字请以贵司经营数据核验。</span>
            </span>
        </div>
    </footer>
    <script src="js/i18n.js"></script>
    <script src="js/cases-data.js"></script>
    <script src="js/ops-store.js"></script>
    <script src="js/accounts.js"></script>
    <script src="js/accounts.local.js"></script>
    <script src="js/license.js"></script>
    <script src="js/scoped-store.js"></script>
    <script src="js/audit-log.js"></script>
    <script src="js/auth-gate.js"></script>
    <script src="js/yoway-orb.js"></script>
    <script>YouweiAuth.initPublic();</script>
    <script>
        (function () {
            const I = window.YouweiI18n;
            const t = (k) => I ? I.t(k) : k;
            const d = () => (I && I.dict()) || {};
            const params = new URLSearchParams(location.search);
            const item = (window.YouweiOps && YouweiOps.getDeliverableById)
                ? YouweiOps.getDeliverableById(params.get('id'))
                : (window.getWendaoDeliverableById && getWendaoDeliverableById(params.get('id')));
            const app = document.getElementById('app');
            const esc = (s) => String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

            function figureHtml(kind) {
                if (kind === 'canvas' || kind === 'briefing') {
                    const loc = (d().dels && d().dels.briefing) || {};
                    const sheet = I && I.bmcInner ? I.bmcInner(false) : '';
                    return `<div class="figure">
                        <p class="fig-label">${esc(loc.fig || '')}</p>
                        <div class="bmc-sheet">${sheet}</div>
                    </div>`;
                }
                if (kind === 'architecture' || kind === 'heatmap') {
                    const loc = (d().dels && d().dels.heatmap) || {};
                    const four = d().fourA || [];
                    const head = d().gapHead || [];
                    const rows = d().gapRows || [];
                    const tiles = d().heatTiles || [];
                    const tileCls = ['is-r', 'is-y', 'is-g'];
                    return `<div class="figure">
                        <p class="fig-label">${esc(loc.fig || '')}</p>
                        <div class="arch">
                            <div class="four-a">
                                ${four.map((row) => `<article><em>${esc(row.k)}</em><b>${esc(row.t)}</b><p>${esc(row.d)}</p></article>`).join('')}
                            </div>
                            <div class="arch-split">
                                <div class="gap-mini">
                                    <table>
                                        <thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead>
                                        <tbody>
                                            ${rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}
                                        </tbody>
                                    </table>
                                </div>
                                <div class="heat-mini">
                                    ${tiles.map((tile, i) => `<div class="tile ${tileCls[i] || ''}"><b>${esc(tile.t)}</b><i>${esc(tile.d)}</i></div>`).join('')}
                                </div>
                            </div>
                        </div>
                    </div>`;
                }
                if (kind === 'roadmap') {
                    const loc = (d().dels && d().dels.roadmap) || {};
                    const axis = d().ganttAxis || [];
                    const rows = d().ganttRows || [];
                    const bar = ['p0', 'p1', 'p2'];
                    return `<div class="figure">
                        <p class="fig-label">${esc(loc.fig || '')}</p>
                        <div class="gantt">
                            <div class="gantt-axis"><span></span><ol>${axis.map((x) => `<li>${esc(x)}</li>`).join('')}</ol></div>
                            ${rows.map((row, i) => `<div class="grow"><b>${esc(row.k)}</b><div class="track"><i class="bar ${bar[i] || ''}"></i></div><small>${esc(row.d)}</small></div>`).join('')}
                        </div>
                    </div>`;
                }
                const locPack = (d().dels && d().dels.export) || {};
                const steps = (d().steps || []).map((s) => s.short);
                return `<div class="figure">
                    <p class="fig-label">${esc(locPack.fig || '')}</p>
                    <div class="pack">
                        <div class="sheets">
                            ${steps.map((name, i) => `<div class="sheet"><div class="lines"><i></i><i></i><i></i></div><em>${String(i + 1).padStart(2, '0')}</em><b>${esc(name)}</b></div>`).join('')}
                        </div>
                    </div>
                </div>`;
            }

            function paint() {
                if (I) I.applyStatic();
                if (!item) {
                    document.title = t('missing') + ' · Yoway';
                    app.innerHTML = `<div class="missing"><h1>${esc(t('missing'))}</h1><p class="one">${esc(t('home'))}</p><p style="margin-top:24px"><a class="back" href="index.html#deliverables">${esc(t('backTake'))}</a></p></div>`;
                    return;
                }
                const loc = (d().dels && d().dels[item.id]) || {};
                document.title = (loc.title || item.title) + ' · 友为';
                const how = [
                    { n: '01', t: loc.how1t || t('how1t'), d: loc.how1d || t('how1d') },
                    { n: '02', t: loc.how2t || t('how2t'), d: loc.how2d || loc.use || item.use || '' },
                    { n: '03', t: loc.how3t || t('how3t'), d: loc.how3d || t('how3d') }
                ];
                const TOC = [
                    { id: 'sec-what', label: t('delWhat') },
                    { id: 'sec-how', label: t('delHow') },
                    { id: 'sec-look', label: t('delLook') },
                    { id: 'sec-start', label: t('delStart') }
                ];
                app.innerHTML = `
                    <div class="page">
                        <div class="layout">
                            <nav class="toc" aria-label="${esc(t('tocPage'))}">
                                <p>${esc(t('tocPage'))}</p>
                                ${TOC.map((row) => `<a href="#${row.id}">${esc(row.label)}</a>`).join('')}
                            </nav>
                            <div class="col">
                                <header class="head">
                                    <p class="kicker">${esc(loc.kicker || item.kicker || t('navTake'))}</p>
                                    ${loc.audience ? `<p class="who">${esc(loc.audience)}</p>` : ''}
                                    <h1>${esc(loc.title || item.title)}</h1>
                                    <p class="one">${esc(loc.blurb || item.blurb)}</p>
                                    <div class="actions">
                                        <a class="btn-sage" href="workshop.html?mode=pro">${esc(t('cta'))}</a>
                                        <a class="back" href="index.html#deliverables">${esc(t('backOutputs'))}</a>
                                    </div>
                                </header>
                                <section class="block" id="sec-what">
                                    <p class="scqa-label">01 · ${esc(t('delWhat'))}</p>
                                    <h2>${esc(t('delWhatH2'))}</h2>
                                    <p>${esc(loc.situation || loc.blurb || item.blurb)}</p>
                                    <div class="goal-split">
                                        <article class="goal-card"><b>${esc(t('goalCard'))}</b><p>${esc(loc.goal || item.use || '')}</p></article>
                                        <article class="goal-card"><b>${esc(t('delNotWhat'))}</b><p>${esc(t('delNotWhatD'))}</p></article>
                                    </div>
                                </section>
                                <section class="block" id="sec-how">
                                    <p class="scqa-label">02 · ${esc(t('delHow'))}</p>
                                    <h2>${esc(t('delHowH2'))}</h2>
                                    <div class="how">
                                        ${how.map((h) => `<article><div class="n">${h.n}</div><div><h3>${esc(h.t)}</h3><p>${esc(h.d)}</p></div></article>`).join('')}
                                    </div>
                                </section>
                                <section class="block" id="sec-look">
                                    <p class="scqa-label">03 · ${esc(t('delLook'))}</p>
                                    <h2>${esc(t('delLookH2'))}</h2>
                                    ${figureHtml(item.figure || item.id)}
                                </section>
                                <section class="block" id="sec-start">
                                    <p class="scqa-label">04 · ${esc(t('delStart'))}</p>
                                    <h2>${esc(t('delStartH2'))}</h2>
                                    <p>${esc(t('delStartLead'))}</p>
                                    <div class="actions">
                                        <a class="btn-sage" href="workshop.html?mode=pro">${esc(t('cta'))}</a>
                                        <a class="back" href="index.html#deliverables">${esc(t('delMore'))}</a>
                                    </div>
                                </section>
                            </div>
                        </div>
                    </div>
                `;
                const tocLinks = [...app.querySelectorAll('.toc a')];
                const sections = TOC.map((row) => document.getElementById(row.id)).filter(Boolean);
                if (window.IntersectionObserver && sections.length) {
                    const io = new IntersectionObserver((entries) => {
                        entries.forEach((entry) => {
                            if (!entry.isIntersecting) return;
                            tocLinks.forEach((a) => a.classList.toggle('is-on', a.getAttribute('href') === '#' + entry.target.id));
                        });
                    }, { rootMargin: '-20% 0px -70% 0px', threshold: 0 });
                    sections.forEach((sec) => io.observe(sec));
                }
            }
            paint();
            if (I) I.bindToggle(paint);
        })();
    </script>
</body>
</html>
